# The frontend's one CI, on GitHub Actions (no Cloud Build, no secret). It runs against the Prism mock only: nothing
# here reaches staging, production or any outside service.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      # The pnpm version comes from package.json's packageManager field.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint (tokens, no literal text in JSX)
        run: pnpm lint

      - name: Format
        run: pnpm format:check

      - name: Unit tests
        run: pnpm test

      # Built with MOCK=1 so the smoke test below can serve this same build against the mock.
      - name: Build
        run: pnpm build
        env:
          MOCK: "1"

      - name: Install Chromium for Playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: Smoke test (Playwright, chromium, against the mock)
        run: pnpm test:e2e
        env:
          MOCK: "1"

      - name: Keep the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
