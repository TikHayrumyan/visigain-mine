      description: |
        This takes the place of the "billing portal link": the Stripe-hosted portal is not linked anywhere (the legal
        build notes say so, and tests/payments/account-cancel.test.ts keeps it that way). Everything is done on /account.
      security: [{ session: [] }]
      requestBody:
