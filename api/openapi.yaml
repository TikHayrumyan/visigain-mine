                  status: { $ref: "#/components/schemas/DirectoryStatus" }
                  detailsRead: { type: boolean }
                  url: { type: [string, "null"] }
                  name: { type: [string, "null"] }
                  address: { type: [string, "null"] }
                  phone: { type: [string, "null"] }
                  compared: { type: array, items: { $ref: "#/components/schemas/NapField" } }
                  differs: { type: array, items: { $ref: "#/components/schemas/NapField" } }
                  isNew: { type: boolean }
                  wasFixed: { type: boolean }
            gap:
              oneOf:
                - type: "null"
                - type: object
                  required: [competitors, directories]
                  additionalProperties: false
                  properties:
                    competitors:
                      type: array
                      items:
                        type: object
                        required: [name, found, checked, date]
                        additionalProperties: false
                        properties:
                          name: { type: string }
                          found: { type: integer }
                          checked: { type: integer }
                          date: { type: string }
                    directories:
                      type: array
                      items:
                        type: object
                        required: [directory, listed, of, competitors]
                        additionalProperties: false
                        properties:
                          directory: { type: string }
                          listed: { type: integer }
                          of: { type: integer }
                          competitors: { type: array, items: { type: string } }
            sentences: { type: array, items: { $ref: "#/components/schemas/ApprovedText" } }
            trend:
              type: array
              items:
                type: object
                required: [date, found, total]
                additionalProperties: false
                properties:
                  date: { type: string }
                  found: { type: integer }
                  total: { type: integer }
    CitationsSection:
      allOf:
        - $ref: "#/components/schemas/SectionBase"
        - properties:
            view: { oneOf: [{ type: "null" }, { $ref: "#/components/schemas/CitationsView" }] }
    ReviewLinkView:
      type: object
      required: [state, googleUrl, yelpUrl]
      additionalProperties: false
      properties:
        state: { type: string, enum: [ready, preparing, no_listing] }
        googleUrl: { type: [string, "null"] }
        yelpUrl: { type: [string, "null"] }
    ReviewLinkSection:
      allOf:
        - $ref: "#/components/schemas/SectionBase"
        - properties:
            view: { oneOf: [{ type: "null" }, { $ref: "#/components/schemas/ReviewLinkView" }] }
    QuickWins:
      type: object
      required: [lines, done, total, canTick]
      additionalProperties: false
      properties:
        lines:
          type: array
          maxItems: 3
          items:
            type: object
            required: [key, title, action, why, done]
            additionalProperties: false
            properties:
              key: { type: string, pattern: "^[0-9a-f]{40}$" }
              title: { $ref: "#/components/schemas/ApprovedText" }
              action: { $ref: "#/components/schemas/ApprovedText" }
              why: { oneOf: [{ type: "null" }, { $ref: "#/components/schemas/ApprovedText" }] }
              done: { type: boolean }
        done: { type: integer }
        total: { type: integer }
        canTick: { type: boolean }
    GradeSummary:
      type: object
      required: [display, letter, score]
      additionalProperties: false
      properties:
        display: { type: [string, "null"] }
        letter: { type: [string, "null"] }
        score: { type: [number, "null"] }
    GradeHistoryItem:
      type: object
      required: [reportId, kind, scanType, domain, deliveredAt, grade]
      additionalProperties: false
      properties:
        reportId: { $ref: "#/components/schemas/Uuid" }
        kind: { type: string, enum: [report, grade] }
        scanType: { type: string, enum: [full, free_only] }
        domain: { type: string }
        deliveredAt: { type: [string, "null"], format: date-time }
        grade: { $ref: "#/components/schemas/GradeSummary" }
        marker: { $ref: "#/components/schemas/Wording" }
    GradeHistoryPage:
      type: object
      required: [items, nextCursor]
      additionalProperties: false
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/GradeHistoryItem" } }
        nextCursor: { $ref: "#/components/schemas/NextCursor" }
    DashboardOverview:
      allOf:
        - $ref: "#/components/schemas/Common"
        - type: object
          required: [organisation, hasData, week, checkedAt, alerts, ai, topThree, grades, tasks, reviews, listing, grid, ranks, citations, count, reviewLink, monitoring, quickWins, businessGrades, creditCents, pastDue]
          properties:
            organisation:
              type: object
              required: [id, name]
              additionalProperties: false
              properties:
                id: { $ref: "#/components/schemas/Uuid" }
                name: { type: string }
            hasData: { type: boolean }
            week: { oneOf: [{ type: "null" }, { $ref: "#/components/schemas/EngineWeek" }] }
            checkedAt: { type: [string, "null"], description: The newest date any part was read. }
            alerts: { type: array, maxItems: 5, items: { $ref: "#/components/schemas/AlertNote" } }
            ai: { $ref: "#/components/schemas/AiSection" }
            topThree: { oneOf: [{ type: "null" }, { $ref: "#/components/schemas/TopThree" }], description: Null on Free. }
            grades: { type: array, description: "The grade over time, oldest first (show the first and the last 5).", items: { $ref: "#/components/schemas/GradeAt" } }
            standardNote: { type: array, items: { $ref: "#/components/schemas/Wording" } }
            comparison: { $ref: "#/components/schemas/Comparison" }
            tasks: { oneOf: [{ type: "null" }, { $ref: "#/components/schemas/Tasks" }], description: Null on Free and without a Full Report. }
            reviews: { $ref: "#/components/schemas/ReviewsSection" }
            listing: { $ref: "#/components/schemas/ListingSection" }
            grid: { $ref: "#/components/schemas/GridSection" }
            ranks: { $ref: "#/components/schemas/RanksSection" }
            citations: { $ref: "#/components/schemas/CitationsBriefSection" }
            count: { oneOf: [{ type: "null" }, { $ref: "#/components/schemas/CitationCount" }], description: "Free: the directory count alone." }
            reviewLink: { $ref: "#/components/schemas/ReviewLinkSection" }
            monitoring:
              description: A business with Monitoring - since when, the weekly slot and the last check.
              oneOf:
                - type: "null"
                - type: object
                  required: [since, slot, lastCheck]
                  additionalProperties: false
                  properties:
                    since: { type: [string, "null"] }
                    slot:
                      description: "The weekly check's day and hour (Los Angeles time); null when not scheduled."
                      oneOf:
                        - type: "null"
                        - type: object
                          required: [weekday, hourLa]
                          additionalProperties: false
                          properties:
                            weekday: { type: integer, minimum: 0, maximum: 6, description: 0 is Sunday. }
                            hourLa: { type: integer, minimum: 0, maximum: 23 }
                    lastCheck: { type: [string, "null"] }
            quickWins: { oneOf: [{ type: "null" }, { $ref: "#/components/schemas/QuickWins" }], description: "QUICK_WINS_ENABLED, Monitoring, first 7 days only." }
            businessGrades:
              type: array
              description: '"Your businesses": each business of the organisation with its latest grade.'
              items:
                type: object
                required: [business, latest]
                additionalProperties: false
                properties:
                  business: { $ref: "#/components/schemas/MemberBusiness" }
                  latest: { oneOf: [{ type: "null" }, { $ref: "#/components/schemas/GradeHistoryItem" }] }
            creditCents: { $ref: "#/components/schemas/Cents" }
            pastDue:
              type: array
              description: Monitoring subscriptions whose last payment failed (link to /account).
              items:
                type: object
                required: [subscriptionId, domain]
                additionalProperties: false
                properties:
                  subscriptionId: { $ref: "#/components/schemas/Uuid" }
                  domain: { type: string }
    TickTaskRequest:
      type: object
      required: [task, done]
      additionalProperties: false
      properties:
        task: { type: string, maxLength: 500, description: "The task's `title`, as given in `tasks.items`." }
        done: { type: boolean }
    TickQuickWinRequest:
      type: object
      required: [key, done]
      additionalProperties: false
      properties:
        key: { type: string, pattern: "^[0-9a-f]{40}$" }
        done: { type: boolean }
    GridPageView:
      allOf:
        - $ref: "#/components/schemas/GridBrief"
        - type: object
          required: [map, competitors, you, trend, trendChangedOn, trendAcrossBases]
          properties:
            map:
              oneOf:
                - type: "null"
                - type: object
                  required: [light, dark, credit]
                  additionalProperties: false
                  properties:
                    light: { type: string, description: "/api/v1/dashboard/grid/map?b=…&keyword=…&theme=light" }
                    dark: { type: string }
                    credit:
                      type: object
                      required: [text, href]
                      additionalProperties: false
                      description: The map data's attribution (a licence notice, shown as given).
                      properties:
                        text: { type: string }
                        href: { type: string }
            competitors:
              type: array
              items:
                type: object
                required: [name, averageRank, locations, reviews, rating, category]
                additionalProperties: false
                properties:
                  name: { type: string }
                  averageRank: { type: number }
                  locations: { type: integer }
                  reviews: { type: [integer, "null"] }
                  rating: { type: [number, "null"] }
                  category: { type: [string, "null"] }
            you:
              type: object
              required: [reviews, rating, category]
              additionalProperties: false
              properties:
                reviews: { type: [integer, "null"] }
                rating: { type: [number, "null"] }
                category: { type: [string, "null"] }
            trend:
              type: array
              items:
                type: object
                required: [date, averageRank, shareTop3Text]
                additionalProperties: false
                properties:
                  date: { type: string }
                  averageRank: { type: [number, "null"] }
                  shareTop3Text: { type: string, description: "'A formatted percentage such as \"43%\" (a number, not a sentence).'" }
            trendChangedOn: { type: [string, "null"] }
            trendAcrossBases: { type: boolean }
    GridPageData:
      allOf:
        - $ref: "#/components/schemas/Common"
        - type: object
          required: [keywords, grid]
          properties:
            keywords:
              type: array
              maxItems: 5
              items:
                type: object
                required: [keyword, selected]
                additionalProperties: false
                properties:
                  keyword: { type: string }
                  selected: { type: boolean }
            grid:
              allOf:
                - $ref: "#/components/schemas/SectionBase"
                - properties:
                    view: { oneOf: [{ type: "null" }, { $ref: "#/components/schemas/GridPageView" }] }
    RanksPageData:
      allOf:
        - $ref: "#/components/schemas/Common"
        - type: object
          required: [ranks]
          properties:
            ranks: { $ref: "#/components/schemas/RanksSection" }
    CitationsPageData:
      allOf:
        - $ref: "#/components/schemas/Common"
        - type: object
          required: [count, citations]
          properties:
            count: { oneOf: [{ type: "null" }, { $ref: "#/components/schemas/CitationCount" }], description: "Free: the count alone." }
            citations: { $ref: "#/components/schemas/CitationsSection" }

    # ------------------------------------------------------------ reports and orders
    OrderStatus:
      type: string
      enum: [pending_payment, abandoned, paid, scan_running, report_held, delivered, failed, refunded]
      x-wording-keys:
        pending_payment: dashboard.order_status.pending_payment
        abandoned: account.status.not_paid
        paid: dashboard.order_status.paid
        scan_running: dashboard.order_status.scan_running
        report_held: dashboard.order_status.report_held
        delivered: dashboard.order_status.delivered
        failed: dashboard.order_status.failed
        refunded: common.shared.refunded
    OrderSummary:
      type: object
      required: [id, kind, status, amountCents, currency, comp, createdAt]
      additionalProperties: false
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        kind: { type: string, enum: [full_report, monitoring_included] }
        status: { $ref: "#/components/schemas/OrderStatus" }
        amountCents: { $ref: "#/components/schemas/Cents" }
        currency: { $ref: "#/components/schemas/Currency" }
        comp: { type: boolean, description: Given free by staff (no payment shown). }
        createdAt: { type: string, format: date-time }
    BusinessRef:
      type: object
      required: [id, domain, name]
      additionalProperties: false
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        domain: { type: string }
        name: { type: [string, "null"] }
    ReportListPage:
      type: object
      required: [items, nextCursor]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            type: object
            required: [order, business]
            additionalProperties: false
            properties:
              order: { $ref: "#/components/schemas/OrderSummary" }
              business: { $ref: "#/components/schemas/BusinessRef" }
        nextCursor: { $ref: "#/components/schemas/NextCursor" }
    ReportPage:
      type: object
      oneOf:
        - $ref: "#/components/schemas/ReportReady"
        - $ref: "#/components/schemas/ReportRefunded"
      discriminator:
        propertyName: state
        mapping:
          ready: "#/components/schemas/ReportReady"
          refunded: "#/components/schemas/ReportRefunded"
    ReportReady:
      type: object
      required: [state, report, business, view, pdf, credit, comparison]
      additionalProperties: false
      properties:
        state: { type: string, const: ready }
        report:
          type: object
          required: [id, kind, scanType, deliveredAt]
          additionalProperties: false
          properties:
            id: { $ref: "#/components/schemas/Uuid" }
            kind: { type: string, enum: [report, grade] }
            scanType: { type: string, enum: [full, free_only] }
            deliveredAt: { type: [string, "null"], format: date-time }
        business:
          type: object
          required: [domain, name]
          additionalProperties: false
          properties:
            domain: { type: string }
            name: { type: [string, "null"] }
        view: { $ref: "#/components/schemas/ClientReport" }
        pdf:
          description: Full Reports only (null for a grade).
          oneOf:
            - type: "null"
            - type: object
              required: [state, href]
              additionalProperties: false
              properties:
                state: { type: string, enum: [ready, pending, not_ready, withdrawn] }
                href: { type: [string, "null"], description: "/api/v1/reports/{id}/pdf when ready." }
        credit:
          description: The live Full Report credit toward Monitoring (14 days), else null.
          oneOf:
            - type: "null"
            - type: object
              required: [until, amountCents]
              additionalProperties: false
              properties:
                until: { type: string, format: date-time }
                amountCents: { $ref: "#/components/schemas/Cents" }
        comparison: { oneOf: [{ type: "null" }, { $ref: "#/components/schemas/Comparison" }] }
    ReportRefunded:
      type: object
      required: [state, freeGradeId]
      additionalProperties: false
      properties:
        state: { type: string, const: refunded }
        freeGradeId: { oneOf: [{ type: "null" }, { $ref: "#/components/schemas/Uuid" }] }
    OrderPage:
      type: object
      required: [order, business, reportId, paidAt, deliveredAt, refund, creditAmountCents, creditExpiresAt, unpaidNotice, lateNotice, refundRequestedAt]
      additionalProperties: false
      properties:
        order: { $ref: "#/components/schemas/OrderSummary" }
        business: { $ref: "#/components/schemas/BusinessRef" }
        reportId: { oneOf: [{ type: "null" }, { $ref: "#/components/schemas/Uuid" }], description: The Full Report once delivered. }
        paidAt: { type: [string, "null"], format: date-time }
        deliveredAt: { type: [string, "null"], format: date-time }
        refund:
          oneOf:
            - type: "null"
            - type: object
              required: [refundedCents, usedCents, refundedAt, why]
              additionalProperties: false
              properties:
                refundedCents: { $ref: "#/components/schemas/Cents" }
                usedCents: { $ref: "#/components/schemas/Cents" }
                refundedAt: { type: [string, "null"], format: date-time }
                why: { oneOf: [{ type: "null" }, { $ref: "#/components/schemas/Wording" }] }
        creditAmountCents: { $ref: "#/components/schemas/Cents" }
        creditExpiresAt: { type: [string, "null"], format: date-time }
        unpaidNotice: { type: [string, "null"], enum: [confirming, failed, not_paid, checking, null] }
        lateNotice: { type: boolean, description: The late-report notice was sent and the report is not delivered yet. }
        refundRequestedAt: { type: [string, "null"], format: date-time }

    # ------------------------------------------------------------ checkout
    CheckoutTerms:
      type: object
      required: [legalVersion, refundConsentText, refundSectionMarkdown, monitoringBoxes, renewalTerms]
      additionalProperties: false
      properties:
        legalVersion: { type: string }
        refundConsentText: { $ref: "#/components/schemas/ApprovedText" }
        refundSectionMarkdown: { $ref: "#/components/schemas/ApprovedText" }
        monitoringBoxes:
          type: object
          required: [terms, business, renewal]
          additionalProperties: false
          properties:
            terms: { $ref: "#/components/schemas/ApprovedText" }
            business: { $ref: "#/components/schemas/ApprovedText" }
            renewal: { $ref: "#/components/schemas/ApprovedText" }
        renewalTerms: { $ref: "#/components/schemas/ApprovedText" }
    FullReportCheckoutRequest:
      type: object
      required: [domain, category, refundConsent]
      additionalProperties: false
      properties:
        domain: { $ref: "#/components/schemas/Domain" }
        category: { type: string, minLength: 1, maxLength: 80 }
        businessName: { type: string, maxLength: 200 }
        city: { type: string, maxLength: 80 }
        state: { $ref: "#/components/schemas/StateCode" }
        refundConsent: { type: boolean, const: true, description: The refund-terms box (refundConsentText). }
        legalVersion: { type: string, description: "The legalVersion the buyer saw; a different one in force answers 409 legal_version_changed." }
        partner: { type: string, maxLength: 40 }
    MonitoringCheckoutRequest:
      type: object
      required: [domain, category, term, termsConsent, businessConsent, renewalConsent]
      additionalProperties: false
      properties:
        domain: { $ref: "#/components/schemas/Domain" }
        category: { type: string, minLength: 1, maxLength: 80 }
        state: { $ref: "#/components/schemas/StateCode" }
        term: { type: string, const: monthly }
        termsConsent: { type: boolean, const: true }
        businessConsent: { type: boolean, const: true }
        renewalConsent: { type: boolean, const: true }
        legalVersion: { type: string }
        partner: { type: string, maxLength: 40 }
    CheckoutClient:
      type: object
      description: The only key the browser receives. `fake` is the test gateway (local and CI only).
      oneOf:
        - $ref: "#/components/schemas/CheckoutClientStripe"
        - $ref: "#/components/schemas/CheckoutClientFake"
      discriminator:
        propertyName: mode
        mapping:
          stripe: "#/components/schemas/CheckoutClientStripe"
          fake: "#/components/schemas/CheckoutClientFake"
    CheckoutClientStripe:
      type: object
      required: [mode, publishableKey]
      additionalProperties: false
      properties:
        mode: { type: string, const: stripe }
        publishableKey: { type: string, pattern: "^pk_(test|live)_" }
        testModeNotice: { type: boolean }
    CheckoutClientFake:
      type: object
      required: [mode]
      additionalProperties: false
      properties:
        mode: { type: string, const: fake }
    PaymentElementSetup:
      type: object
      required: [client, clientSecret, wallets, returnPath]
      additionalProperties: false
      properties:
        client: { $ref: "#/components/schemas/CheckoutClient" }
        clientSecret: { type: [string, "null"], description: "For stripe.elements({ clientSecret }); confirmPayment, or confirmSetup when kind is card." }
        setupIntentId: { type: string }
        wallets: { type: boolean }
        returnPath: { type: string, pattern: "^/", description: "The same-site page Stripe returns to (confirmParams.return_url = origin + returnPath)." }
    CreditPreview:
      type: object
      required: [priceCents, dueTodayCents, usedNowCents, leftCents]
      additionalProperties: false
      properties:
        priceCents: { $ref: "#/components/schemas/Cents" }
        dueTodayCents: { $ref: "#/components/schemas/Cents" }
        usedNowCents: { $ref: "#/components/schemas/Cents" }
        leftCents: { $ref: "#/components/schemas/Cents" }
    CheckoutStarted:
      type: object
      required: [checkoutId, kind, reused, amountCents, currency, credit, payment]
      additionalProperties: false
      properties:
        checkoutId: { $ref: "#/components/schemas/Uuid" }
        kind: { type: string, enum: [order, subscription, card] }
        reused: { type: boolean }
        amountCents: { $ref: "#/components/schemas/Cents" }
        currency: { $ref: "#/components/schemas/Currency" }
        credit: { oneOf: [{ type: "null" }, { $ref: "#/components/schemas/CreditPreview" }] }
        payment: { $ref: "#/components/schemas/PaymentElementSetup" }
    CheckoutState:
      type: object
      required: [checkoutId, kind, status, lastError, landingPath, payment]
      additionalProperties: false
      properties:
        checkoutId: { $ref: "#/components/schemas/Uuid" }
        kind: { type: string, enum: [order, subscription, card] }
        status: { type: string, enum: [open, processing, succeeded, canceled] }
        lastError: { oneOf: [{ type: "null" }, { $ref: "#/components/schemas/Wording" }], description: "The last refused try, e.g. common.shared.the_payment_did_not_go_through." }
        landingPath: { type: string, pattern: "^/", description: "Where to go once paid: /dashboard/orders/{id} or /dashboard/monitoring." }
        payment:
          description: To draw the pay step again while `open`; null otherwise.
          oneOf: [{ type: "null" }, { $ref: "#/components/schemas/PaymentElementSetup" }]
    ConfirmCheckoutRequest:
      type: object
      additionalProperties: false
      properties:
        setupIntentId: { type: string, pattern: "^seti_[A-Za-z0-9_]+$" }
    CheckoutConfirmed:
      type: object
      required: [done, status]
      additionalProperties: false
      properties:
        done: { type: boolean }
        status: { type: string, enum: [open, processing, succeeded, canceled] }

    # ------------------------------------------------------------ account
    CardSummary:
      type: object
      required: [brand, last4, expMonth, expYear]
      additionalProperties: false
      properties:
        brand: { type: string }
        last4: { type: string, pattern: "^\\d{4}$" }
        expMonth: { type: [integer, "null"] }
        expYear: { type: [integer, "null"] }
    AccountSubscription:
      type: object
      required: [id, domain, state, live, term, paidUntil, nextChargeAt, nextPriceCents, nextChargeCents, creditLeftCents, creditAppliedCents, updating, card, cardUnknown, cancelRequestedAt, endedAt, chargeSeen, canCancel]
      additionalProperties: false
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        domain: { type: string }
        state:
          type: string
          enum: [on, cancelled, payment_failed, unpaid, ended]
          x-wording-keys: { on: dashboard.monitoring.active, cancelled: account.status.cancelled, payment_failed: dashboard.monitoring.payment_failed, unpaid: account.status.not_paid_yet, ended: dashboard.monitoring.ended }
        live: { type: boolean }
        term: { type: string, const: monthly }
        paidUntil: { type: [string, "null"], format: date-time }
        nextChargeAt: { type: [string, "null"], format: date-time }
        nextPriceCents: { $ref: "#/components/schemas/Cents" }
        nextChargeCents: { $ref: "#/components/schemas/Cents" }
        creditLeftCents: { $ref: "#/components/schemas/Cents" }
        creditAppliedCents: { $ref: "#/components/schemas/Cents" }
        updating: { type: boolean, description: 'A payment is settling: show "Updating your account" and read again.' }
        card: { oneOf: [{ type: "null" }, { $ref: "#/components/schemas/CardSummary" }] }
        cardUnknown: { type: boolean }
        cancelRequestedAt: { type: [string, "null"], format: date-time }
        endedAt: { type: [string, "null"], format: date-time }
        chargeSeen: { type: [string, "null"], enum: [charged, not_charged, unknown, null] }
        canCancel: { type: boolean }
    Account:
      type: object
      required: [role, subscriptions]
      additionalProperties: false
      properties:
        role: { $ref: "#/components/schemas/MemberRole" }
        subscriptions: { type: array, items: { $ref: "#/components/schemas/AccountSubscription" } }
    DocumentSummary:
      type: object
      required: [id, kind, at, what, number, amountCents, creditCents, refundedCents, status]
      additionalProperties: false
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        kind: { type: string, enum: [invoice, receipt] }
        at: { type: string, format: date-time }
        what: { $ref: "#/components/schemas/Wording" }
        number: { type: [string, "null"] }
        amountCents: { $ref: "#/components/schemas/Cents" }
        creditCents: { $ref: "#/components/schemas/Cents" }
        refundedCents: { type: [integer, "null"] }
        status:
          type: string
          enum: [paid, not_paid, cancelled, refunded]
          x-wording-keys: { paid: common.shared.paid, not_paid: account.status.not_paid, cancelled: account.status.cancelled, refunded: common.shared.refunded }
    DocumentListPage:
      type: object
