openapi: 3.1.0
info:
  title: Visigain API
  version: 1.0.0
  summary: The contract between visigain-frontend and visigain-backend, for launch (30 November 2026).
  description: |
    Every path is under `/api/v1`, on the same domain as the pages (no CORS). Read `docs/api/README.md` first.

    **Conventions**
    - Field names are the server's own (camelCase, as in `src/server/**`). The only snake_case names are the fixed
      ones: `message_key` in the error object, and engine's week object (`starts_at`, `complete_at`).
    - Money is integer cents with `currency: "usd"`. Ids are UUIDs. Dates are ISO 8601 strings: `format: date-time`
      for a moment, `format: date` for a day; fields marked "as engine gives it" are passed through unchanged.
    - **No client sentence is free text the backend writes.** A sentence is a `Wording`: a key into
      `GET /api/v1/wordings`, or `{ key, params }`. The exceptions are client data (business name, domain, review text,
      numbers, dates, names of directories and assistants) and `ApprovedText`: legal and article bodies, FAQ answers
      and engine's report text, which the backend serves already approved.
    - Lists that grow are paged with `cursor` and `limit`, and answer `{ items, nextCursor }`.
    - Errors are `{ error: { code, message_key } }`; `message_key` is the key of the page's own sentence for that case (`x-wordings.errors`).

    **Mock:** `pnpm api:mock` serves this file on http://127.0.0.1:4010 with the examples. Pick another example with
    the header `Prefer: example=<name>` (for instance `Prefer: example=free` on the overview), or another status with
    `Prefer: code=429`.
  contact:
    name: Visigain backend
    email: admin@visigain.com
security:
  - {}
servers:
  - url: /
    description: Same origin as the pages (production https://visigain.com, staging through the staging proxy).
  - url: http://127.0.0.1:4010
    description: The Prism mock (pnpm api:mock).
tags:
  - name: public
    description: The public site. No session needed.
  - name: auth
    description: Sign-in by magic link, the session and sign out. Google sign-in stays a backend redirect (/auth/google).
  - name: dashboard
    description: A member's business. Session needed; the business is chosen with `?b=<domain>` among the session organisation's own.
  - name: reports
    description: Reports, orders and the PDF.
  - name: checkout
    description: Full Report (US$99) and Monitoring (US$149 a month) through the Stripe Payment Element.
  - name: account
    description: Subscriptions, invoices and receipts, the payment method, cancelling Monitoring.

# ---------------------------------------------------------------- wordings
# Every wording key this contract names. A key in `errors` or an `x-wording-keys` table is a real catalogue key
# (api/wordings/catalogue.generated.ts) with approved text, except the ones listed under `pending`:
#  - "catalogue gap": the sentence is live today, but built in server code the catalogue does not read yet. No new words:
#    the catalogue build must take it from the source named. The key named here is the API-side name to give it.
#  - "draft needed": no approved sentence exists; it goes through the strategist's draft round first.
# A name ending in ".*" stands for a family. tests/api/contract.test.ts holds every rule.
x-wordings:
  errors:
    unauthenticated: auth.auth.sign_in_to_visigain
    cross_site_refused: errors.error.something_went_wrong
    owner_only: account.account.only_an_owner_of_this_organisation
    not_found: errors.not_found.we_can_t_find_that_page
    no_organisation: dashboard.overview.no_businesses_yet_buy_a_full
    no_business: dashboard.overview.no_businesses_yet_buy_a_full
    report_covered: dashboard.monitoring.monitoring_includes_the_full_report_we
    already_monitored: errors.already_monitored
    legal_version_changed: errors.legal_version_changed
    idempotency_key_reused: errors.error.something_went_wrong
    pdf_preparing: dashboard.reports.the_pdf_is_being_prepared
    report_refunded: dashboard.reports.this_report_was_refunded_so_it
    too_large: errors.error.something_went_wrong
    invalid_email: site.free_ai_check.please_enter_a_valid_email_address
    invalid_email@postContact: errors.contact.invalid_email
    invalid_domain: site.free_ai_check.that_doesn_t_look_like_a
    invalid_name: errors.invalid_name
    invalid_message: errors.invalid_message
    invalid_category: errors.invalid_category
    category_unsupported: dashboard.shared.we_can_t_grade_this_type
    invalid_state: errors.invalid_form
    invalid_locale: errors.error.something_went_wrong
    consent_required: errors.consent_required
    disposable_email: site.scan.please_use_an_email_address_you
    disposable_email@postContact: errors.contact.disposable_email
    form_expired: site.scan.this_page_was_open_for_a
    link_invalid: errors.link_invalid
    rate_limited: errors.too_many_requests.try_again_in_a_little_while
    rate_limited@postScan: site.scan.we_can_t_start_another_scan
    rate_limited@postContact: errors.contact.rate_limited
    checkout_paused: dashboard.shared.payments_are_paused_for_the_moment_2840
    scans_paused: site.scan.the_free_scan_is_paused_for
    scan_busy: site.scan.the_free_scan_is_busy_right
    payments_unavailable: errors.payments_unavailable
    cancel_failed: errors.cancel_failed
    unknown: errors.global_error.something_went_wrong_on_our_side
  theme:
    description: "The theme switch (src/components/theme-toggle.tsx; the frontend keeps the theme itself, no API call). The button's label is switch, with [now] and [next] the theme names; [next] in lower case."
    x-wording-keys:
      group: common.theme_toggle.theme
      switch: common.theme_toggle.theme_switch_to
      follow_device: common.theme_toggle.follow_my_device
      system: common.theme.system
      light: common.theme.light
      dark: common.theme.dark
  pending:
    errors.legal_version_changed: { status: draft needed, for: "409: the legal version in force changed since the buyer saw the terms (new behaviour). Proposed in docs/product-v2/new-wordings.md (the section The API's new sentence), for the strategist; not a table row yet, so it holds no deploy; the starts that answer it stand behind API_CHECKOUT_ENABLED, refused in production" }
    common.move.points.*: { status: catalogue gap, for: "a share's move said in points (up [by] points, up 1 point): the code picks point or points, so it is no one sentence", source: "src/server/engine/v2/view.ts pointsMove" }
    dashboard.ranks.found: { status: catalogue gap, for: "[found] of [of] searches found, down or up from [before]: the code picks search or searches, and down or up", source: "src/server/engine/v2/view.ts rankFoundSentence" }
    dashboard.alert.*: { status: catalogue gap, for: "AlertNote.sentence, per kind: each sentence is built with clauses the code adds or leaves out (the duplicate's name, the review's no-reply line)", source: "src/server/v2/alerts/wording.ts" }
    dashboard.comparison.figure: { status: catalogue gap, for: "Compared with the [label]: [N], and (you are below it) added by the code", source: "src/server/city-averages/wording.ts comparedLine" }
    dashboard.comparison.preparing: { status: catalogue gap, for: "the being-prepared line with an estimate: the code picks 1 hour or [N] hours", source: "src/server/city-averages/wording.ts preparingLine, estimateWords" }
    site.scan.directory_count: { status: catalogue gap, for: "the free grade's directory count line: the code picks directory or directories (plural)", source: "src/server/engine/v2/view.ts directoryCountSentence" }
    dashboard.citations.count: { status: catalogue gap, for: "CitationCount.text: the same sentence, the same plural", source: "src/server/engine/v2/view.ts directoryCountSentence" }
    dashboard.grid.basis.*: { status: catalogue gap, for: "GridNumbers.basis and changeReason: built with plurals and clauses the code picks", source: "src/server/engine/v2/view.ts grid numbers (basis)" }
    dashboard.v2.*: { status: catalogue gap, for: "other loader sentences (reviews.notAvailable, standardNote and markers, refund why): no key named yet", source: "src/server/v2/load.ts, standard-change.ts, src/server/orders/refund-shown.ts" }
    common.customers.*: { status: catalogue gap, for: "CategoryWords: engine's own word for a profile's customers (clients, patients) is engine's data, not a wording; the core word is served (common.customers.customers)", source: "src/server/v2/category-words/wording.ts" }
    common.customer.*: { status: catalogue gap, for: "CategoryWords (singular): the same; the core word is served (common.customer.customer)", source: "src/server/v2/category-words/wording.ts" }
    site.scan.directory_count.*: { status: catalogue gap, for: "the count's other lines: coming_soon, not_in_area, and the hint confirm_hint", source: "src/server/engine/v2/view.ts DIRECTORY_COUNT_COMING_SOON, DIRECTORY_COUNT_NOT_IN_AREA; src/server/freescan/directory-count.ts COUNT_CONFIRM_HINT" }

paths:
  # ---------------------------------------------------------------- public
  /api/v1/wordings:
    get:
      tags: [public]
      operationId: getWordings
      summary: The approved wording catalogue, by locale and namespace
      description: |
        Only approved entries are ever returned (the wording gate is server-side). A key the frontend needs and does
        not find here is a question for Backend, never a sentence to type. `version` is the catalogue's content hash,
        also sent as the `ETag`; send it back in `If-None-Match` for a 304.

        **The mock** (Prism) answers every call with the whole English export (api/examples/wordings.en.json, built by
        `pnpm api:examples`): it ignores `ns`, `locale` and `If-None-Match`, never answers 304, and always sends the
        same ETag. Filter by namespace yourself when you work against the mock; the real endpoint filters.
      parameters:
        - name: locale
          in: query
          required: true
          schema: { $ref: "#/components/schemas/Locale" }
        - name: ns
          in: query
          required: false
          description: One namespace; all of them when left out.
          schema: { $ref: "#/components/schemas/WordingNamespace" }
        - name: If-None-Match
          in: header
          required: false
          schema: { type: string }
      responses:
        "200":
          description: The catalogue (or one namespace of it).
          headers:
            ETag: { $ref: "#/components/headers/WordingsETag" }
            Cache-Control: { $ref: "#/components/headers/WordingsCacheControl" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WordingCatalogue" }
              examples:
                en: { $ref: "examples/wordings.en.json" }
        "304":
          description: Not modified (the ETag matched).
          headers:
            ETag: { $ref: "#/components/headers/WordingsETag" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/v1/site:
    get:
      tags: [public]
      operationId: getSite
      summary: The switches the frontend must obey, and the legal version
      responses:
        "200":
          description: The switches, read on every request (cache for at most 60 seconds).
          headers:
            Cache-Control: { $ref: "#/components/headers/SiteCacheControl" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Site" }
              examples:
                open: { $ref: "examples/site-open.json" }
                holding: { $ref: "examples/site-holding.json" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/v1/legal/{slug}:
    get:
      tags: [public]
      operationId: getLegalPage
      summary: A legal page in force (Markdown, English only)
      parameters:
        - name: slug
          in: path
          required: true
          schema: { $ref: "#/components/schemas/LegalSlug" }
      responses:
        "200":
          description: The page in force.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LegalPage" }
              examples:
                refunds: { $ref: "examples/legal-refunds.json" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/v1/legal/lines:
    get:
      tags: [public]
      operationId: getLegalLines
      summary: The legal words shown outside the legal pages (the privacy notice, the grade's opinion line, the free scan's boxes)
      description: |
        These are recorded word for word when someone agrees (consent records keep the exact text and version), so
        the frontend shows them exactly as given and never from the wordings catalogue. English only.
      responses:
        "200":
          description: The lines in force.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LegalLines" }
              examples:
                lines: { $ref: "examples/legal-lines.json" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/v1/legal/archive:
    get:
      tags: [public]
      operationId: getLegalArchive
      summary: Every archived legal version, newest first
      responses:
        "200":
          description: The archive's index.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LegalArchive" }
              examples:
                archive: { $ref: "examples/legal-archive.json" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/v1/legal/archive/{version}/{slug}:
    get:
      tags: [public]
      operationId: getArchivedLegalPage
      summary: One legal page as it stood in an earlier (or the current) version
      parameters:
        - name: version
          in: path
          required: true
          schema: { type: string, pattern: "^v\\d+\\.\\d+$", examples: ["v3.16"] }
        - name: slug
          in: path
          required: true
          schema: { $ref: "#/components/schemas/LegalSlug" }
      responses:
        "200":
          description: The archived page.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ArchivedLegalPage" }
              examples:
                terms: { $ref: "examples/legal-archive-terms.json" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/v1/pricing:
    get:
      tags: [public]
      operationId: getPricing
      summary: Prices from PRICES (never typed), the fair-use lines and the pricing FAQ
      responses:
        "200":
          description: The prices.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Pricing" }
              examples:
                pricing: { $ref: "examples/pricing.json" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/v1/contact:
    post:
      tags: [public]
      operationId: postContact
      summary: Send the contact form
      description: |
        `website` is the honeypot: leave it empty (a filled one is answered 204 and nothing is kept). Limits: 5 an
        hour per visitor address, 3 a day per email. Open while the holding page is on.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ContactRequest" }
            examples:
              message: { $ref: "examples/contact-request.json" }
      responses:
        "204": { description: Received (or the honeypot was filled). }
        "403": { $ref: "#/components/responses/Forbidden" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/v1/scans/form:
    get:
      tags: [public]
      operationId: getScanForm
      summary: What the free scan form needs before it is shown (the signed form stamp, the categories, the states)
      description: |
        The stamp is the anti-bot check the page renders today (`issueFormStamp`): the form must be open at least
        3 seconds and at most a day, and one stamp is accepted at most 3 times. Ask for a new one each time the form is drawn.
      responses:
        "200":
          description: The form's data.
          headers:
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScanForm" }
              examples:
                form: { $ref: "examples/scan-form.json" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/v1/scans:
    post:
      tags: [public]
      operationId: postScan
      summary: Start a free scan
      description: |
        Answers the same way for a reused lead (same email and domain within 24 hours) and a new one. A filled
        honeypot (`message`) gets a decoy token that always reads `running`. Closed while the holding page is on.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScanRequest" }
            examples:
              scan: { $ref: "examples/scan-request.json" }
      responses:
        "201":
          description: Started (or reused). Show `/scan/{viewToken}`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScanStarted" }
              examples:
                started: { $ref: "examples/scan-started.json" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /api/v1/scans/{token}:
    get:
      tags: [public]
      operationId: getScan
      summary: A free scan's status, then its result
      description: Poll while `status` is `running` (every 300 seconds when `startsBy` is set, otherwise every 30).
      parameters:
        - $ref: "#/components/parameters/ViewToken"
        - $ref: "#/components/parameters/LocaleQuery"
      responses:
        "200":
          description: The scan.
          headers:
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FreeScanView" }
              examples:
                running: { $ref: "examples/scan-running.json" }
                ready: { $ref: "examples/scan-ready.json" }
                failed: { $ref: "examples/scan-failed.json" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/v1/scans/confirm/{code}:
    post:
      tags: [public]
      operationId: confirmScan
      summary: Confirm the email of a free scan (the code from the emailed link)
      description: |
        The emailed link itself (`/scan/confirm/<code>`) stays a backend path, which redirects to `/scan/<token>`.
        This is for a frontend page that confirms by itself. A code with a bad signature still answers the token it
        carries, unconfirmed.
      parameters:
        - name: code
          in: path
          required: true
          schema: { type: string, maxLength: 120, pattern: "^[\\w-]{8,64}\\.[0-9a-f]{32}$" }
      responses:
        "200":
          description: Confirmed (or already confirmed).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScanConfirmed" }
              examples:
                confirmed: { $ref: "examples/scan-confirmed.json" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/v1/sample-report:
    get:
      tags: [public]
      operationId: getSampleReport
      summary: The public sample report (an invented business), in the client-safe report shape
      parameters:
        - $ref: "#/components/parameters/LocaleQuery"
      responses:
        "200":
          description: The sample.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClientReport" }
              examples:
                sample: { $ref: "examples/sample-report.json" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/v1/faq:
    get:
      tags: [public]
      operationId: getFaq
      summary: The FAQ (the CMS's published entries, else the approved site copy)
      responses:
        "200":
          description: The questions in order.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Faq" }
              examples:
                faq: { $ref: "examples/faq.json" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/v1/articles:
    get:
      tags: [public]
      operationId: listArticles
      summary: Published articles, the canonical definition first
      parameters:
        - name: category
          in: query
          required: false
          schema: { type: string, maxLength: 80 }
        - name: tag
          in: query
          required: false
          schema: { type: string, maxLength: 80 }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: One page of articles.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ArticleList" }
              examples:
                articles: { $ref: "examples/articles.json" }
                empty: { $ref: "examples/articles-empty.json" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/v1/articles/{slug}:
    get:
      tags: [public]
      operationId: getArticle
      summary: One article (Markdown body, already approved)
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string, pattern: "^[a-z0-9-]{1,120}$" }
      responses:
        "200":
          description: The article.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Article" }
              examples:
                article: { $ref: "examples/article.json" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/v1/about:
    get:
      tags: [public]
      operationId: getAbout
      summary: The About page's paragraphs (as keys) and the company's facts
      responses:
        "200":
          description: The About page.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/About" }
              examples:
                about: { $ref: "examples/about.json" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/v1/consent:
    post:
      tags: [public]
      operationId: postConsent
      summary: Record the privacy notice being shown, agreed to or opted out of
      description: |
        No body. Sets the `vg_bid` browser id cookie (HttpOnly, a year) when there is none. `opt_out` is always
        answered 204, even over the limit (60 a minute per visitor address).
      parameters:
        - name: event
          in: query
          required: true
          schema: { type: string, enum: [shown, agree, opt_out] }
      responses:
        "204": { description: Recorded. }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/v1/events:
    post:
      tags: [public]
      operationId: postEvent
      summary: A page view, for analytics (only with the `vg_consent=all` cookie and no GPC or do-not-sell signal)
      description: Without consent it is answered 204 and nothing is kept. 120 a minute per visitor address; body at most 4,000 bytes.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PageViewEvent" }
            examples:
              view: { $ref: "examples/event-request.json" }
      responses:
        "204": { description: "Recorded, or skipped without consent." }
        "403": { $ref: "#/components/responses/Forbidden" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/RateLimited" }

  # ---------------------------------------------------------------- auth
  /api/v1/auth/magic-link:
    post:
      tags: [auth]
      operationId: requestMagicLink
      summary: Email a sign-in link
      description: |
        Always 202 whether or not the email has an account (no enumeration). Limits: 5 links an hour per email, 20 an
        hour per visitor address. The link opens `/auth/verify#token=…` (a page the frontend serves; the token is in
        the fragment, so no server log sees it). It works once and expires in 15 minutes.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MagicLinkRequest" }
            examples:
              signin: { $ref: "examples/magic-link-request.json" }
      responses:
        "202": { description: "If the address can sign in, a link is on its way. Show the check-your-email page." }
        "403": { $ref: "#/components/responses/Forbidden" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/v1/auth/verify:
    post:
      tags: [auth]
      operationId: verifyMagicLink
      summary: Sign in with the link's token (a POST, so mail scanners that open links can't use them up)
      description: |
        Ends any session this browser held, starts a new one and sets the `vg_session` cookie. 100 tries an hour per
        visitor address. An admin whose link pointed at /admin gets `redirectTo: "/admin"` (a backend path).
      requestBody:
        required: true
        content:
