        display: { type: [string, "null"] }
        letter: { type: [string, "null"] }
        score: { type: [number, "null"] }
    GradeHistoryItem:
      type: object
      required: [reportId, kind, scanType, domain, deliveredAt, grade]
      additionalProperties: false
      properties:
        reportId: { $ref: "#/components/schemas/Uuid" }
        kind: { type: string, enum: [report, grade] }
        scanType: { type: string, enum: [full, free_only] }
        domain: { type: string }
        deliveredAt: { type: [string, "null"], format: date-time }
