                watch: { $ref: "examples/monitoring-watch.json" }
                hidden: { $ref: "examples/monitoring-hidden.json" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/v1/monitoring/site-watch:
    get:
      tags: [monitoring]
      operationId: getMonitoringSiteWatch
      summary: The business's Site Watch card (the site, its certificate, its domain, the booking links)
      description: |
        The Monitoring page's Site Watch card (src/server/fixes/site-watch, behind FIXERS_ENABLED and the `guardian`
        switch): the stored states and the card's lines in order. Hidden while the gate is shut or without Monitoring.
      x-visigain-availability: behind-switch
      x-visigain-switch: FIXERS_ENABLED
      security: [{ session: [] }]
      parameters:
        - $ref: "#/components/parameters/BusinessDomain"
      responses:
        "200":
          description: The card, or hidden.
          headers:
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          content:
            application/json:
              schema: { oneOf: [{ $ref: "#/components/schemas/MonitoringSiteWatch" }, { $ref: "#/components/schemas/MonitoringHidden" }] }
              examples:
                siteWatch: { $ref: "examples/monitoring-site-watch.json" }
                hidden: { $ref: "examples/monitoring-hidden.json" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/v1/dashboard/tasks:
