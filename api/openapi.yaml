                  required: [name, address, phone]
                  additionalProperties: false
                  properties:
                    name: { type: [string, "null"] }
                    address: { type: [string, "null"] }
                    phone: { type: [string, "null"] }
            listings:
              type: array
              items:
                type: object
                required: [source, status, detailsRead, url, name, address, phone, compared, differs, isNew, wasFixed]
                additionalProperties: false
                properties:
                  source: { type: string }
                  status: { $ref: "#/components/schemas/DirectoryStatus" }
                  detailsRead: { type: boolean }
