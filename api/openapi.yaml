        facts_heading: dashboard.monitoring.facts_heading
        facts_none: dashboard.monitoring.facts_none
        facts_area: dashboard.monitoring.facts_area
        facts_waiting: dashboard.monitoring.facts_waiting
        facts_week: dashboard.monitoring.facts_week
        label_said: dashboard.monitoring.label_said
        label_ours: dashboard.monitoring.label_ours
        label_source: dashboard.monitoring.label_source
        asked_by: dashboard.monitoring.asked_by
        seen_in: dashboard.monitoring.seen_in
        fix_heading: dashboard.monitoring.fix_heading
        fix_done: dashboard.monitoring.fix_done
        fix_dismiss: dashboard.monitoring.fix_dismiss
        fix_done_note: dashboard.monitoring.fix_done_note
        alert_heading: dashboard.monitoring.alert_heading
        alert_text: dashboard.monitoring.alert_text
        alert_other: dashboard.monitoring.alert_other
        guardian_heading: dashboard.monitoring.guardian_heading
        guardian_none: dashboard.monitoring.guardian_none
        guardian_waiting: dashboard.monitoring.guardian_waiting
        label_before: dashboard.monitoring.label_before
        label_now: dashboard.monitoring.label_now
        duplicate_heading: dashboard.monitoring.duplicate_heading
        duplicate_text: dashboard.monitoring.duplicate_text
        holiday_heading: dashboard.monitoring.holiday_heading
        holiday_reminder: dashboard.monitoring.holiday_reminder
        holiday_none: dashboard.monitoring.holiday_none
        holiday_note: dashboard.monitoring.holiday_note
        value_closed: dashboard.monitoring.value_closed
        locked_state: dashboard.monitoring.state_coming
      required: [availability, business, factsLocked, facts, guardian, holidays]
      additionalProperties: false
      properties:
        availability: { const: shown }
        business: { $ref: "#/components/schemas/MonitoringBusiness" }
        factsLocked: { type: boolean }
        facts:
          oneOf:
            - type: "null"
            - type: object
              required: [kind]
              additionalProperties: false
              properties:
                kind: { type: string, enum: [hidden, area_not_supported, waiting] }
            - type: object
              required: [kind, week, rows]
              additionalProperties: false
              properties:
                kind: { const: ok }
                week: { type: string, format: date, description: "facts_week's [date] (the week's Monday)." }
                rows: { type: array, items: { $ref: "#/components/schemas/FactCheckRow" }, description: "Without the rows the owner said were not needed; empty: facts_none." }
        guardian:
          oneOf:
            - type: "null"
            - type: object
              required: [kind]
              additionalProperties: false
              properties:
                kind: { type: string, enum: [hidden, waiting] }
            - type: object
              required: [kind, week, alerts, changes, duplicates]
              additionalProperties: false
              properties:
                kind: { const: ok }
                week: { type: string }
                alerts:
                  type: array
                  description: "Drawn first: notFound is the prominent alert (alert_heading, alert_text), never told as a suspension; any other is label with alert_other."
                  items:
                    type: object
                    required: [field, notFound, label]
                    additionalProperties: false
                    properties:
                      field: { type: string }
                      notFound: { type: boolean }
                      label: { $ref: "#/components/schemas/Wording" }
                changes:
                  type: array
                  items:
                    type: object
                    required: [field, label, before, now, seenAt]
                    additionalProperties: false
                    properties:
                      field: { type: string }
                      label: { $ref: "#/components/schemas/Wording" }
                      before: { $ref: "#/components/schemas/ListingValue" }
                      now: { $ref: "#/components/schemas/ListingValue" }
                      seenAt: { $ref: "#/components/schemas/EngineDate" }
                duplicates:
                  type: array
                  description: "duplicate_text with [name]."
                  items:
                    type: object
                    required: [name]
                    additionalProperties: false
                    properties:
                      name: { type: string }
        holidays:
          oneOf:
            - type: "null"
            - type: object
              required: [kind]
              additionalProperties: false
              properties:
                kind: { const: hidden }
            - type: object
              required: [kind, days, reminders]
              additionalProperties: false
              properties:
                kind: { const: ok }
                days: { type: integer, description: "holiday_none's [days]." }
                reminders:
                  type: array
                  description: "holiday_reminder with [holiday] (name's word), [date] and [hours]; then holiday_note."
                  items:
                    type: object
                    required: [holiday, name, date, hours]
                    additionalProperties: false
                    properties:
                      holiday: { type: string }
                      name: { $ref: "#/components/schemas/Wording" }
                      date: { type: string, format: date }
                      hours: { type: string }
    MonitoringSiteWatch:
      type: object
      x-wording-keys:
        title: dashboard.monitoring.site_watch
        intro: dashboard.monitoring.we_check_that_your_website_loads
        checked_at: dashboard.monitoring.last_checked
      required: [availability, business, card]
      additionalProperties: false
      properties:
        availability: { const: shown }
        business: { $ref: "#/components/schemas/MonitoringBusiness" }
        card:
          type: object
          required: [uptime, ssl, domainExpiry, booking, checkedAt, lines]
          additionalProperties: false
          properties:
            uptime:
              oneOf:
                - type: "null"
                - type: object
                  required: [status, since, checkedAt]
                  additionalProperties: false
                  properties:
                    status: { type: string }
                    since: { type: string, format: date-time }
                    checkedAt: { type: [string, "null"], format: date-time }
            ssl: { $ref: "#/components/schemas/SiteWatchExpiry" }
            domainExpiry: { $ref: "#/components/schemas/SiteWatchExpiry" }
            booking:
              type: object
              required: [found, links, checkedAt]
              additionalProperties: false
              properties:
                found: { type: [integer, "null"] }
                links:
                  type: array
                  items:
                    type: object
                    required: [url, status]
                    additionalProperties: false
                    properties:
                      url: { type: string }
                      status: { type: string }
                checkedAt: { type: [string, "null"], format: date-time }
            checkedAt: { type: [string, "null"], format: date-time, description: "checked_at's [time]." }
            lines:
              type: array
              description: "The card's lines in order (the site, the certificate, the domain, the booking links), each in its tone."
              items:
                type: object
                required: [key, text, tone]
                additionalProperties: false
                properties:
                  key: { type: string }
                  text: { $ref: "#/components/schemas/Wording" }
                  tone: { type: string, enum: [ok, warn, danger, neutral] }
    SiteWatchExpiry:
      oneOf:
        - type: "null"
        - type: object
          required: [status, notAfter, checkedAt]
          additionalProperties: false
          properties:
            status: { type: string }
            notAfter: { type: [string, "null"], format: date-time }
            checkedAt: { type: [string, "null"], format: date-time }
    TasksPage:
      type: object
      required: [plan, tasks]
      additionalProperties: false
      properties:
        plan: { $ref: "#/components/schemas/PlanLevel" }
        tasks: { oneOf: [{ type: "null" }, { $ref: "#/components/schemas/Tasks" }] }
    QuickWinsPage:
      type: object
      required: [quickWins]
      additionalProperties: false
      properties:
        quickWins: { oneOf: [{ type: "null" }, { $ref: "#/components/schemas/QuickWins" }] }
