                      properties:
                        text: { type: string }
                        href: { type: string }
            competitors:
              type: array
              items:
                type: object
                required: [name, averageRank, locations, reviews, rating, category]
                additionalProperties: false
                properties:
                  name: { type: string }
                  averageRank: { type: number }
                  locations: { type: integer }
                  reviews: { type: [integer, "null"] }
                  rating: { type: [number, "null"] }
                  category: { type: [string, "null"] }
            you:
              type: object
              required: [reviews, rating, category]
              additionalProperties: false
              properties:
                reviews: { type: [integer, "null"] }
                rating: { type: [number, "null"] }
                category: { type: [string, "null"] }
            trend:
              type: array
              items:
                type: object
                required: [date, averageRank, shareTop3Text]
                additionalProperties: false
                properties:
                  date: { type: string }
                  averageRank: { type: [number, "null"] }
                  shareTop3Text: { type: string, description: 'A formatted percentage such as "43%" (a number, not a sentence).' }
            trendChangedOn: { type: [string, "null"] }
            trendAcrossBases: { type: boolean }
    GridPageData:
      allOf:
        - $ref: "#/components/schemas/Common"
