  # ---------------------------------------------------------------- checkout
  /api/v1/checkout/terms:
    get:
      tags: [checkout]
      operationId: getCheckoutTerms
      summary: The exact consent words and renewal terms shown before paying (recorded word for word when ticked)
      responses:
        "200":
          description: The terms in force.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CheckoutTerms" }
              examples:
                terms: { $ref: "examples/checkout-terms.json" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/v1/checkout/full-report:
    post:
      tags: [checkout]
      operationId: startFullReportCheckout
      summary: Start (or resume) a US$99 Full Report - creates the order and its PaymentIntent
      description: |
        Records the refund-terms consent and the legal version. The same buyer, business and price within 60 minutes
        gets the same unpaid order back (`reused: true`). 409 `report_covered`: Monitoring already includes the
        report (go to `/dashboard/monitoring`). 409 `legal_version_changed`: `legalVersion` was sent and is not the
        one in force (read `GET /checkout/terms` again). 503 `checkout_paused` when CHECKOUT_ENABLED is off, and while
        the API's own switch API_CHECKOUT_ENABLED is off (staging only until `errors.legal_version_changed` is approved).
      security: [{ session: [] }]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FullReportCheckoutRequest" }
            examples:
              order: { $ref: "examples/checkout-full-report-request.json" }
      responses:
        "201":
          description: The order to pay with the Payment Element.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CheckoutStarted" }
              examples:
                order: { $ref: "examples/checkout-full-report.json" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /api/v1/checkout/monitoring:
    post:
      tags: [checkout]
      operationId: startMonitoringCheckout
      summary: Start (or resume) Monitoring at US$149 a month - creates the subscription, places the Full Report credit
      description: |
        The credit rule: a paid, unrefunded Full Report for the same business within 14 days counts toward
        Monitoring once (US$99 against US$149 leaves US$50 due today; `credit` shows it). Records the three consents,
        the renewal terms and the legal version. `kind` is `card` only when nothing is due today (a credit of at least
        the price). 409 `already_monitored`, `legal_version_changed`. 503 `checkout_paused` (as for the Full Report).
      security: [{ session: [] }]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MonitoringCheckoutRequest" }
            examples:
              monitoring: { $ref: "examples/checkout-monitoring-request.json" }
      responses:
        "201":
          description: The subscription to pay with the Payment Element.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CheckoutStarted" }
              examples:
                withCredit: { $ref: "examples/checkout-monitoring.json" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /api/v1/checkout/{id}:
    get:
      tags: [checkout]
      operationId: getCheckout
      summary: A checkout's state (the pay step, then done or pending) - read from Stripe on every call
      description: "`id` is the `checkoutId` from the start call: an order id or a subscription id."
      security: [{ session: [] }]
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: The checkout.
          headers:
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CheckoutState" }
              examples:
                open: { $ref: "examples/checkout-state-open.json" }
                succeeded: { $ref: "examples/checkout-state-succeeded.json" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/v1/checkout/{id}/confirm:
    post:
      tags: [checkout]
      operationId: confirmCheckout
      summary: After Stripe.js confirmed - ask the backend to settle now rather than wait for Stripe's event
      description: |
        For a subscription it reconciles with Stripe (`paymentConfirmed`); for the no-charge card step it saves the
        card (`saveCard`, with `setupIntentId`). For an order it only reads the state. Safe to repeat.
      security: [{ session: [] }]
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConfirmCheckoutRequest" }
            examples:
              card: { $ref: "examples/confirm-checkout-request.json" }
      responses:
        "200":
          description: Whether it is settled.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CheckoutConfirmed" }
              examples:
                done: { $ref: "examples/checkout-confirmed.json" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/RateLimited" }

