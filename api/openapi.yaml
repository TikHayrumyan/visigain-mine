      operationId: startPaymentMethodUpdate
      summary: Start replacing a subscription's card (a SetupIntent for the Payment Element) - owners only
      description: |
        This takes the place of the "billing portal link": the Stripe-hosted portal is not linked anywhere (the legal
        build notes say so, and tests/payments/account-cancel.test.ts keeps it that way). Everything is done on /account.
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SubscriptionRef" }
            examples:
              sub: { $ref: "examples/subscription-ref.json" }
      responses:
        "201":
          description: The card form to draw.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentMethodUpdate" }
              examples:
                setup: { $ref: "examples/payment-method-update.json" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /api/v1/account/payment-method/finish:
    post:
      tags: [account]
      operationId: finishPaymentMethodUpdate
      summary: After Stripe.js confirmed the SetupIntent - make the new card the subscription's own
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FinishPaymentMethodRequest" }
            examples:
              finish: { $ref: "examples/finish-payment-method-request.json" }
      responses:
        "200":
          description: The card now on file (null while Stripe has not finished).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentMethodFinished" }
              examples:
                card: { $ref: "examples/payment-method-finished.json" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/v1/account/monitoring/cancel:
    post:
      tags: [account]
      operationId: cancelMonitoring
      summary: Cancel Monitoring at the end of the paid period (owners only; one click plus one confirmation)
      description: |
        A never-paid subscription ends at once (`cancelled_unpaid`). Pressing twice is safe (`already`). 503
        `cancel_failed`: Stripe did not answer and nothing was changed.
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CancelRequest" }
            examples:
              cancel: { $ref: "examples/cancel-request.json" }
      responses:
        "200":
          description: The outcome.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CancelOutcome" }
              examples:
                cancelled: { $ref: "examples/cancel-outcome.json" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Unavailable" }

components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: vg_session
      description: |
        The session cookie: HttpOnly, SameSite=Lax, Secure in production, 30 days (renewed when under 15 days left).
        Set by POST /api/v1/auth/verify (and by Google's backend redirect). The frontend never reads it.
        CSRF: every non-GET request must carry an `Origin` header equal to the host, or it is refused 403
        `cross_site_refused` before routing. Browsers send it themselves on same-origin fetches.

  headers:
    WordingsETag:
      description: The catalogue's version (the body's `version`), quoted; send it back in If-None-Match. The mock always sends this one.
      schema: { type: string }
      example: '"5b5f657338c2aa30"'
    WordingsCacheControl:
      description: The catalogue may be kept 5 minutes, then checked again with If-None-Match.
      schema: { type: string }
      example: public, max-age=300, must-revalidate
    SiteCacheControl:
      description: The switches may be kept at most 60 seconds.
      schema: { type: string }
      example: public, max-age=60
    MapETag:
      description: The picture's version (32 hex characters, quoted).
      schema: { type: string }
      example: '"5d41402abc4b2a76b9719d911017c592"'
    MapCacheControl:
      description: As the current map route sends it.
      schema: { type: string }
      example: private, max-age=86400, stale-while-revalidate=2592000
    NoStore:
      description: Always `no-store`.
      schema: { type: string, const: no-store }
      example: no-store
    RetryAfter:
      description: Seconds until the limit's window ends.
      schema: { type: integer, minimum: 1 }
      example: 1800
    SetSessionCookie:
      description: "`vg_session=<token>; Path=/; HttpOnly; SameSite=Lax; Secure; Max-Age=2592000`"
      schema: { type: string }
      example: vg_session=bW9jay1zZXNzaW9uLXRva2VuLWludmVudGVk; Path=/; HttpOnly; SameSite=Lax; Secure; Max-Age=2592000
    ClearSessionCookie:
      description: "`vg_session=; Path=/; Max-Age=0`"
      schema: { type: string }
      example: vg_session=; Path=/; Max-Age=0

  parameters:
    BusinessDomain:
      name: b
      in: query
      required: false
      description: The business's domain, among the session organisation's own. Missing or empty means the first (Monitoring first, then Full Report, then Free); any other domain that is not one of the organisation's own (another organisation's included) is 404 `not_found`, the same answer as a domain that does not exist, never the first business's data.
      schema: { type: string, maxLength: 200, examples: ["sunset-glow-medspa.test"] }
    BusinessDomainRequired:
      name: b
      in: query
      required: true
      description: The business's domain, among the session organisation's own.
      schema: { type: string, maxLength: 200, examples: ["sunset-glow-medspa.test"] }
    Id:
      name: id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Uuid" }
    ViewToken:
      name: token
      in: path
      required: true
      description: The free scan's view token.
      schema: { type: string, pattern: "^[\\w.-]{8,200}$" }
    LocaleQuery:
      name: locale
      in: query
      required: false
      description: "`es` only while `spanish` is on in /site; engine's own sentences stay English."
      schema: { $ref: "#/components/schemas/Locale" }
    Cursor:
      name: cursor
      in: query
      required: false
      description: The `nextCursor` of the page before; leave out for the first page. Opaque.
      schema: { type: string, maxLength: 200 }
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        A fresh random key per checkout attempt (16 to 64 of A-Z a-z 0-9 _ -), reused on a retry of the same press.
        The same key with the same body within 24 hours answers the first answer again (with the header
        `Idempotent-Replayed: true`); with another body, 422 `idempotency_key_reused` (the IETF Idempotency-Key draft's
        answer). Only a success is kept: a refusal may be sent again with the same key. A missing or malformed key is 422
        `invalid_state`. (The backend also reuses an unpaid order or subscription of the last 60 minutes.)
      schema: { type: string, pattern: "^[A-Za-z0-9_-]{16,64}$" }

  responses:
    Unauthenticated:
      description: No session, or it ended. Send the visitor to /signin?next=<this page>.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            unauthenticated: { $ref: "examples/error-unauthenticated.json" }
    Forbidden:
      description: Refused (no matching Origin on a non-GET, or the role is not allowed).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            crossSite: { $ref: "examples/error-cross-site.json" }
            ownerOnly: { $ref: "examples/error-owner-only.json" }
    NotFound:
      description: Unknown, or not this organisation's (the two are never told apart).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            notFound: { $ref: "examples/error-not-found.json" }
    Conflict:
      description: The request clashes with the current state (see the endpoint's description for its codes).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            noBusiness: { $ref: "examples/error-no-business.json" }
            reportCovered: { $ref: "examples/error-report-covered.json" }
            pdfPreparing: { $ref: "examples/error-pdf-preparing.json" }
    Gone:
      description: Withdrawn for good (a refunded report's PDF).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            refunded: { $ref: "examples/error-report-refunded.json" }
    TooLarge:
      description: The body is over the limit.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            tooLarge: { $ref: "examples/error-too-large.json" }
    Unprocessable:
      description: The input is not valid. `code` names what is wrong (for a form, the field).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            email: { $ref: "examples/error-invalid-email.json" }
            domain: { $ref: "examples/error-invalid-domain.json" }
    RateLimited:
      description: Over a limit. Retry after `Retry-After` seconds.
      headers:
        Retry-After: { $ref: "#/components/headers/RetryAfter" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            rateLimited: { $ref: "examples/error-rate-limited.json" }
    Unavailable:
      description: Paused by a switch, or a provider did not answer. Nothing was changed or charged.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            checkoutPaused: { $ref: "examples/error-checkout-paused.json" }
            scansPaused: { $ref: "examples/error-scans-paused.json" }

  schemas:
    # ------------------------------------------------------------ primitives
    Uuid: { type: string, format: uuid, pattern: "^[0-9a-f-]{36}$" }
    Cents: { type: integer, minimum: 0, description: "US cents (9900 = US$99.00)." }
    Currency: { type: string, const: usd }
    Locale: { type: string, enum: [en, es] }
    Domain: { type: string, minLength: 3, maxLength: 253, examples: ["sunset-glow-medspa.test"] }
    StateCode: { type: string, pattern: "^[A-Z]{2}$", description: A two-letter US state code. }
    EngineDate: { type: string, description: "A date or date-time as engine gives it (ISO 8601)." }
    WordingNamespace: { type: string, enum: [site, dashboard, checkout, account, auth, common, errors] }
    WordingKey:
      type: string
      pattern: "^[a-z0-9_.-]+$"
      maxLength: 200
      description: A key into GET /api/v1/wordings, `<namespace>.<rest>`.
      examples: ["dashboard.dashboard.no_data_yet"]
    WordingParams:
      type: object
      description: The values for the sentence's [name] placeholders. Numbers and dates are formatted by the frontend for its locale.
      additionalProperties: { type: [string, number] }
    WordingRef:
      type: object
      required: [key]
      additionalProperties: false
      properties:
        key: { $ref: "#/components/schemas/WordingKey" }
        params: { $ref: "#/components/schemas/WordingParams" }
    Wording:
      description: A sentence, as a key alone or a key with its params. Never free text.
      oneOf:
        - $ref: "#/components/schemas/WordingKey"
        - $ref: "#/components/schemas/WordingRef"
    ApprovedText:
      type: string
      description: |
        Text the backend serves already approved and the frontend shows as it is: legal, article and FAQ bodies
        (Markdown where named so), and engine's report text (findings, fixes and their effort words such as "an hour",
        questions). English only.
    Error:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: object
          required: [code, message_key]
          additionalProperties: false
          properties:
            code: { type: string, pattern: "^[a-z0-9_]+$" }
            message_key:
              allOf: [{ $ref: "#/components/schemas/WordingKey" }]
              description: The key of the sentence the page shows for this case today (the table in the spec's x-wordings.errors).
    NextCursor: { type: [string, "null"], description: "The cursor for the next page; null on the last." }

    # ------------------------------------------------------------ public
    WordingCatalogue:
      type: object
      required: [locale, version, entries]
      additionalProperties: false
      properties:
        locale: { $ref: "#/components/schemas/Locale" }
        version: { type: string, description: The catalogue's content hash (also the ETag). }
        entries:
          type: object
          description: "Every approved entry: `<namespace>.<rest>` to its sentence, with [name] placeholders."
          propertyNames: { $ref: "#/components/schemas/WordingKey" }
          additionalProperties: { type: string }
    Site:
      type: object
      required: [holding, holdingPages, checkout, checkoutWallets, apiCheckout, aiChat, share, spanish, legalVersion, legalVersionNumber, legalPageVersions]
      additionalProperties: false
      properties:
        holding: { type: boolean, description: "SITE_HOLDING, effective (also on while production holds for an unapproved wording)." }
        holdingPages: { type: array, items: { type: string }, description: "HOLDING_PAGES: the only pages served while holding; every other path shows the holding page." }
        checkout: { type: boolean, description: "CHECKOUT_ENABLED, effective (also off while holding, when the pay pages are closed): off pauses payments (the start calls answer 503 checkout_paused)." }
        checkoutWallets: { type: boolean, description: "CHECKOUT_WALLETS (refused in production): Apple Pay and Google Pay in the Payment Element; off whenever checkout is." }
        apiCheckout: { type: boolean, description: "API_CHECKOUT_ENABLED, effective (staging only; always false in production, and off whenever CHECKOUT_ENABLED is off or the site is holding): whether this API's own starts, POST /checkout/full-report and POST /checkout/monitoring, start a payment now; while it is false they answer 503 checkout_paused. `checkout` keeps meaning the pay pages' switch. Added 7 November 2026." }
        aiChat: { type: boolean, description: "AI_CHAT_ENABLED (the global switch; a business may still be off)." }
        share: { type: boolean, description: "SHARE_REPORT_ENABLED: share links on Full Reports." }
        spanish: { type: boolean, description: "SPANISH_SITE_ENABLED, effective (always off in production while Spanish is not all approved)." }
        legalVersion: { type: string, examples: ["v3.17, 5 Nov 2026"] }
        legalVersionNumber: { type: string, examples: ["3.17"] }
        legalPageVersions:
          type: object
          required: [terms, privacy, refunds, cookies]
          additionalProperties: false
          properties:
            terms: { type: string }
            privacy: { type: string }
            refunds: { type: string }
            cookies: { type: string }
    LegalSlug: { type: string, enum: [terms, privacy, refunds, cookies, accessibility] }
    LegalPage:
      type: object
      required: [slug, title, version, effectiveDate, legalVersion, path, bodyMarkdown]
      additionalProperties: false
      properties:
        slug: { $ref: "#/components/schemas/LegalSlug" }
        title: { $ref: "#/components/schemas/Wording" }
        version: { type: [string, "null"], description: "The page's own version (null for accessibility)." }
        effectiveDate: { type: [string, "null"], format: date }
        legalVersion: { type: string }
        path: { type: string, description: "The page's own address (/terms, /privacy, /refunds, /cookies, /accessibility)." }
        bodyMarkdown:
          allOf: [{ $ref: "#/components/schemas/ApprovedText" }]
          description: Markdown without the title line; render with links as written. Always English (lang="en").
    LegalLines:
      type: object
      required: [noticeVersion, notice, noticeButtons, gradeOpinionLine, freeScanConsent, marketingConsent]
      additionalProperties: false
      properties:
        noticeVersion: { type: string, description: The Cookie Policy version the notice belongs to (recorded with each notice event). }
        notice:
          type: object
          required: [standardMarkdown, gpcMarkdown]
          additionalProperties: false
          description: The first-visit privacy notice; `gpcMarkdown` where the browser sends Global Privacy Control.
          properties:
            standardMarkdown: { $ref: "#/components/schemas/ApprovedText" }
            gpcMarkdown: { $ref: "#/components/schemas/ApprovedText" }
        noticeButtons:
          type: object
          required: [agree, optOut, optedOut]
          additionalProperties: false
          properties:
            agree: { $ref: "#/components/schemas/ApprovedText" }
            optOut: { $ref: "#/components/schemas/ApprovedText" }
            optedOut: { $ref: "#/components/schemas/ApprovedText" }
        gradeOpinionLine: { $ref: "#/components/schemas/ApprovedText" }
        freeScanConsent: { $ref: "#/components/schemas/ApprovedText" }
        marketingConsent: { $ref: "#/components/schemas/ApprovedText" }
    LegalArchive:
      type: object
      required: [current, versions]
      additionalProperties: false
      properties:
        current: { type: string, examples: ["v3.17"] }
        versions:
          type: array
          items:
            type: object
            required: [version, slugs]
            additionalProperties: false
            properties:
              version: { type: string, pattern: "^v\\d+\\.\\d+$" }
              slugs: { type: array, items: { $ref: "#/components/schemas/LegalSlug" } }
    ArchivedLegalPage:
      type: object
      required: [version, slug, title, inForce, bodyMarkdown]
      additionalProperties: false
      properties:
        version: { type: string }
        slug: { $ref: "#/components/schemas/LegalSlug" }
        title: { $ref: "#/components/schemas/Wording" }
        inForce: { type: boolean, description: 'True for the version in force (else "An earlier version").' }
        bodyMarkdown: { $ref: "#/components/schemas/ApprovedText" }
    Pricing:
      type: object
      required: [currency, free, fullReport, monitoring, fairUse, faq]
      additionalProperties: false
      properties:
        currency: { $ref: "#/components/schemas/Currency" }
        free:
          type: object
          required: [amountCents]
          additionalProperties: false
          properties: { amountCents: { type: integer, const: 0 } }
        fullReport:
          type: object
          required: [amountCents]
          additionalProperties: false
          properties: { amountCents: { $ref: "#/components/schemas/Cents" } }
        monitoring:
          type: object
          required: [amountCents, interval, intervalCount, priceShown]
          additionalProperties: false
          properties:
            amountCents: { $ref: "#/components/schemas/Cents" }
            interval: { type: string, const: month }
            intervalCount: { type: integer, const: 1 }
            priceShown: { type: boolean, description: "The setting pricing.monitoring_public; false shows \"price set later\"." }
        fairUse:
          description: The fair-use block (null when not shown).
          oneOf:
            - type: "null"
            - type: object
              required: [title, lines]
              additionalProperties: false
              properties:
                title: { $ref: "#/components/schemas/Wording" }
                lines: { type: array, items: { $ref: "#/components/schemas/Wording" } }
        faq: { type: array, items: { $ref: "#/components/schemas/FaqItem" } }
    ContactRequest:
      type: object
      required: [name, email, message]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        email: { type: string, format: email, maxLength: 200 }
        message: { type: string, minLength: 10, maxLength: 4000 }
        website: { type: string, maxLength: 200, description: The honeypot. Never shown to people; leave empty. }
        ref: { type: string, maxLength: 500, description: The referrer the visitor came from. }
        utm: { $ref: "#/components/schemas/Utm" }
    Utm:
      type: object
      additionalProperties: false
      properties:
        source: { type: string, maxLength: 200 }
        medium: { type: string, maxLength: 200 }
        campaign: { type: string, maxLength: 200 }
        term: { type: string, maxLength: 200 }
        content: { type: string, maxLength: 200 }
    ScanForm:
      type: object
      required: [stamp, categories, states, defaultState]
      additionalProperties: false
      properties:
        stamp: { type: string, pattern: "^[0-9a-z]{6,12}\\.[\\w-]{4,16}\\.[0-9a-f]{32}$", description: Send back as `started`. }
        categories: { type: array, items: { type: string }, description: "Engine's categories, for the datalist (any text is accepted)." }
        states: { type: array, items: { $ref: "#/components/schemas/StateCode" } }
        defaultState: { $ref: "#/components/schemas/StateCode" }
    ScanRequest:
      type: object
      required: [domain, category, email, consent, started]
      additionalProperties: false
      properties:
        domain: { $ref: "#/components/schemas/Domain" }
        city: { type: string, maxLength: 80 }
        state: { $ref: "#/components/schemas/StateCode" }
        category: { type: string, minLength: 1, maxLength: 80 }
        email: { type: string, format: email, maxLength: 254 }
        consent: { type: boolean, const: true, description: "\"I agree to the Terms of Service and Privacy Policy\"; never pre-ticked." }
        marketing: { type: boolean, default: false }
        started: { type: string, description: The stamp from GET /api/v1/scans/form. }
        message: { type: string, maxLength: 500, description: The honeypot. Leave empty. }
        landing: { type: string, maxLength: 200, pattern: "^/" }
        seen: { type: string, maxLength: 40 }
        ref: { type: string, maxLength: 500 }
        utm: { $ref: "#/components/schemas/Utm" }
        locale: { $ref: "#/components/schemas/Locale", description: "Sent from the Spanish site (only while `spanish` is on): the lead's emails then go in Spanish once approved." }
    ScanStarted:
      type: object
      required: [viewToken]
      additionalProperties: false
      properties:
        viewToken: { type: string }
    ScanConfirmed:
      type: object
      required: [viewToken, first]
      additionalProperties: false
      properties:
        viewToken: { type: string }
        first: { type: boolean, description: True the first time this email is confirmed. }
    FreeScanStatus: { type: string, enum: [unknown, running, ready, held, delayed, failed] }
    FreeScanView:
      type: object
      required: [status, lead, phase, queue, startsBy, busy, slow, scannedAt, failure, grade, competitor, directoryCount, comparison]
      additionalProperties: false
      properties:
        status: { $ref: "#/components/schemas/FreeScanStatus" }
        lead:
          type: object
          required: [domain, category, createdAt]
          additionalProperties: false
          properties:
            domain: { type: string }
            category: { type: [string, "null"] }
            createdAt: { type: string, format: date-time }
        phase: { type: [string, "null"], enum: [collect, evaluate, score, null], description: "Running only: the measuring step (null while waiting for a slot)." }
        queue:
          description: The place in engine's line, while waiting.
          oneOf:
            - type: "null"
            - type: object
              required: [position, estimatedStartAt]
              additionalProperties: false
              properties:
                position: { type: [integer, "null"] }
                estimatedStartAt: { type: [string, "null"], format: date-time }
        startsBy: { type: [string, "null"], format: date-time, description: "Set when engine's daily cap holds the scan: poll every 300 seconds." }
        busy:
          oneOf:
            - type: "null"
            - type: object
              required: [gradeWithinHours]
              additionalProperties: false
              properties: { gradeWithinHours: { type: integer } }
        slow: { type: boolean, description: More than 20 minutes since the scan was asked for. }
        scannedAt: { type: [string, "null"], format: date-time }
        failure:
          description: "Failed only. Drawn as site.scan.we_couldn_t_grade_it_failure_text, its [failure_text] the code's sentence errors.scan_failed.<code>."
          oneOf:
            - type: "null"
            - type: object
              required: [code]
              additionalProperties: false
              properties:
                code: { type: string, enum: [subject_unreachable, integrity_refused, collection_failed, incomplete, provider_failure, internal_error, bad_request, other] }
        grade:
          description: Ready only.
          oneOf: [{ type: "null" }, { $ref: "#/components/schemas/ClientReport" }]
        competitor:
          oneOf:
            - type: "null"
            - type: object
              required: [name, grade, score]
              additionalProperties: false
              properties:
                name: { type: string }
                grade: { type: string }
                score: { type: number }
        directoryCount:
          oneOf:
            - type: "null"
            - type: object
              required: [ready, text, date, hint]
              additionalProperties: false
              properties:
                ready: { type: boolean }
                text: { $ref: "#/components/schemas/Wording" }
                date: { type: [string, "null"] }
                hint: { oneOf: [{ type: "null" }, { $ref: "#/components/schemas/Wording" }] }
        comparison: { oneOf: [{ type: "null" }, { $ref: "#/components/schemas/Comparison" }] }
    GradeArea:
      type: object
      required: [name, score]
      additionalProperties: false
      properties:
        name: { $ref: "#/components/schemas/ApprovedText" }
        score: { type: [number, "null"] }
    ClientFix:
      type: object
      required: [rank, text, effort, diy]
      additionalProperties: false
      properties:
        rank: { type: integer, minimum: 1 }
        text: { $ref: "#/components/schemas/ApprovedText" }
        effort: { $ref: "#/components/schemas/ApprovedText" }
        diy: { type: boolean }
    ClientFinding:
      type: object
      required: [title, area, evidence, items, fix, why, notes]
      additionalProperties: false
      properties:
        title: { $ref: "#/components/schemas/ApprovedText" }
        area: { type: [string, "null"] }
        evidence: { type: [string, "null"] }
        items: { type: array, items: { type: string } }
        fix: { type: [string, "null"] }
        why: { type: [string, "null"] }
        notes: { type: array, items: { type: string } }
    ClientReport:
      type: object
      description: The client-safe projection of a report or grade (src/server/reports/client-view.ts). No check id, points, weight, band or check count is ever in it.
      required: [teaser, standard, measuredAt, business, grade, areas, fixes, findings, summary, method]
      additionalProperties: false
      properties:
        teaser: { type: boolean, description: True for a free grade (the free part of the standard only). }
        standard: { type: [string, "null"], examples: ["1.9.0"] }
        measuredAt: { type: [string, "null"], format: date-time }
        business:
          type: object
          required: [name, domain]
          additionalProperties: false
          properties:
            name: { type: [string, "null"] }
            domain: { type: [string, "null"] }
        grade:
          type: object
          required: [letter, score, display, heldNote, test, average]
          additionalProperties: false
          properties:
            letter: { type: [string, "null"] }
            score: { type: [number, "null"] }
            display: { type: [string, "null"], examples: ["C (58.4)"] }
            heldNote: { oneOf: [{ type: "null" }, { $ref: "#/components/schemas/ApprovedText" }], description: "Engine's sentence for why the grade is held." }
            test: { type: boolean, description: Graded from test data (staff see a marker). }
            average:
              oneOf:
                - type: "null"
                - type: object
                  required: [label, value, below]
                  additionalProperties: false
                  properties:
                    label: { $ref: "#/components/schemas/Wording" }
                    value: { type: string, examples: ["56.3"] }
                    below: { type: boolean }
        areas: { type: array, items: { $ref: "#/components/schemas/GradeArea" } }
        fixes: { type: array, items: { $ref: "#/components/schemas/ClientFix" } }
        findings: { type: array, items: { $ref: "#/components/schemas/ClientFinding" } }
        summary:
          oneOf:
            - type: "null"
            - type: object
              required: [easyWin, more]
              additionalProperties: false
              properties:
                easyWin:
                  oneOf:
                    - type: "null"
                    - type: object
                      required: [title, summary, fix]
                      additionalProperties: false
                      properties:
                        title: { type: string }
                        summary: { type: [string, "null"] }
                        fix: { type: [string, "null"] }
                more:
                  type: array
                  items:
                    type: object
                    required: [title, effort, diy]
                    additionalProperties: false
                    properties:
                      title: { type: string }
                      effort: { type: string }
                      diy: { type: boolean }
                biggest:
                  oneOf:
                    - type: "null"
                    - type: object
                      required: [title, summary]
                      additionalProperties: false
                      properties:
                        title: { type: string }
                        summary: { type: [string, "null"] }
        method: { oneOf: [{ type: "null" }, { $ref: "#/components/schemas/ApprovedText" }] }
    FaqItem:
      type: object
      required: [id, q, a]
      additionalProperties: false
      properties:
        id: { type: string, description: The anchor id. }
        q: { $ref: "#/components/schemas/ApprovedText" }
        a:
          allOf: [{ $ref: "#/components/schemas/ApprovedText" }]
          description: Markdown.
    Faq:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/FaqItem" } }
    ArticleSummary:
      type: object
      required: [slug, title, summary, category, tags, postType, isCanonicalDefinition, isSample, publishedAt, updatedAt, readingMinutes]
      properties:
        slug: { type: string }
        title: { $ref: "#/components/schemas/ApprovedText" }
        summary: { oneOf: [{ type: "null" }, { $ref: "#/components/schemas/ApprovedText" }] }
        category: { type: [string, "null"] }
        tags: { type: array, items: { type: string } }
        postType: { type: string, enum: [article, definition] }
        isCanonicalDefinition: { type: boolean }
        isSample: { type: boolean }
        publishedAt: { type: [string, "null"], format: date-time }
        updatedAt: { type: string, format: date-time }
        readingMinutes: { type: integer, minimum: 1 }
    ArticleList:
      type: object
      required: [items, nextCursor, taxonomy]
      additionalProperties: false
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/ArticleSummary" } }
        nextCursor: { $ref: "#/components/schemas/NextCursor" }
        taxonomy:
          type: object
          required: [categories, tags]
          additionalProperties: false
          properties:
            categories: { type: array, items: { $ref: "#/components/schemas/TaxonomyCount" } }
            tags: { type: array, items: { $ref: "#/components/schemas/TaxonomyCount" } }
    TaxonomyCount:
      type: object
      required: [name, count]
      additionalProperties: false
      properties:
        name: { type: string }
        count: { type: integer }
    Article:
      allOf:
        - $ref: "#/components/schemas/ArticleSummary"
        - type: object
          required: [bodyMarkdown, toc, author, related, seo]
          properties:
            bodyMarkdown: { $ref: "#/components/schemas/ApprovedText" }
            toc:
              type: array
              description: Shown only with 3 or more items.
              items:
                type: object
                required: [level, text, id]
                additionalProperties: false
                properties:
                  level: { type: integer, enum: [2, 3] }
                  text: { type: string }
                  id: { type: string }
            author:
              type: object
              required: [name, url]
              additionalProperties: false
              properties:
                name: { type: string }
                url: { type: string }
            related: { type: array, maxItems: 3, items: { $ref: "#/components/schemas/ArticleSummary" } }
            seo:
              type: object
              required: [title, description, canonicalUrl, noindex]
              additionalProperties: false
              properties:
                title: { type: [string, "null"] }
                description: { type: [string, "null"] }
                canonicalUrl: { type: [string, "null"] }
                noindex: { type: boolean }
    About:
      type: object
      required: [paragraphs, company]
      additionalProperties: false
      properties:
        paragraphs:
          type: array
          description: The page's sentences in order, each with the heading it sits under. Draft sentences are left out until approved.
          items:
            type: object
            required: [section, text]
            additionalProperties: false
            properties:
              section: { type: string, enum: [intro, who, values, monitoring, measure, contact] }
              text: { $ref: "#/components/schemas/Wording" }
        company: { $ref: "#/components/schemas/CompanyFacts" }
    CompanyFacts:
      type: object
      required: [legalName, publicEmail, postalAddress]
      additionalProperties: false
      properties:
        legalName: { type: string }
        publicEmail: { type: string, format: email }
        postalAddress: { type: string }
    PageViewEvent:
      type: object
      required: [name, path, anonymousId]
      additionalProperties: false
      properties:
        name: { type: string, const: page_view }
        path: { type: string, maxLength: 500 }
        anonymousId: { type: string, pattern: "^[A-Za-z0-9_-]{16,64}$" }

    # ------------------------------------------------------------ auth
    MagicLinkRequest:
      type: object
      required: [email]
      additionalProperties: false
      properties:
        email: { type: string, format: email, maxLength: 254 }
        next: { type: string, maxLength: 500, pattern: "^/", description: "Where to go after signing in; anything not a same-site path becomes /dashboard." }
        locale: { $ref: "#/components/schemas/Locale", description: "The Spanish sign-in page's request (the link then opens the Spanish page); `es` is taken only while `spanish` is on in /site." }
    VerifyRequest:
      type: object
      required: [token]
      additionalProperties: false
      properties:
        token: { type: string, minLength: 1, maxLength: 100, description: "The `token` from the link's fragment (#token=)." }
    Verified:
      type: object
      required: [redirectTo]
      additionalProperties: false
      properties:
        redirectTo: { type: string, pattern: "^/", description: "A same-site path (with the /es prefix where Spanish applies)." }
    MemberRole: { type: string, enum: [owner, member] }
    Session:
      type: object
      required: [user, organisations, currentOrganisationId]
      additionalProperties: false
      properties:
        user:
          oneOf:
            - type: "null"
            - type: object
              required: [id, email, name, language, isAdmin]
              additionalProperties: false
              properties:
                id: { $ref: "#/components/schemas/Uuid" }
                email: { type: string, format: email }
                name: { type: [string, "null"] }
                language: { $ref: "#/components/schemas/Locale" }
                isAdmin: { type: boolean, description: Staff; the admin lives on the backend at /admin. }
        organisations:
          type: array
          items:
            type: object
            required: [id, name, role]
            additionalProperties: false
            properties:
              id: { $ref: "#/components/schemas/Uuid" }
              name: { type: string }
              role: { $ref: "#/components/schemas/MemberRole" }
        currentOrganisationId: { oneOf: [{ type: "null" }, { $ref: "#/components/schemas/Uuid" }] }
    SwitchOrganisationRequest:
      type: object
      required: [organisationId]
      additionalProperties: false
      properties:
        organisationId: { $ref: "#/components/schemas/Uuid" }

    # ------------------------------------------------------------ dashboard
    PlanLevel:
      type: string
      enum: [free, report, monitoring]
      x-wording-keys: { free: common.plan.free, report: common.shared.full_report, monitoring: common.shared.monitoring }
    FeatureId: { type: string, enum: [ai_visibility, grid, citations, ranks, reviews, listing_extras, review_link] }
    SectionStatus:
      type: string
      enum: [ready, empty, locked, in_grade, error, held, unavailable, not_in_area]
      description: "What a section says when it has no view. locked: the report key when unlockedBy is report (Full Report and Monitoring), the monitoring key with [plan] when monitoring. in_grade: the feature's own sentence."
      x-wording-keys:
        empty: dashboard.dashboard.no_data_yet
        empty@weekly: dashboard.section.empty_weekly
        locked@report: common.shared.this_is_part_of_the_full
        locked@monitoring: dashboard.kit.this_is_part_of
        in_grade@ai_visibility: common.shared.how_often_ai_assistants_name_your
        in_grade@reviews: common.shared.your_google_reviews_are_already_part
        in_grade@listing_extras: common.shared.where_we_check_them_duplicate_listings
        error: dashboard.dashboard.we_couldn_t_load_this_right
        held: dashboard.section.held
        unavailable: dashboard.section.unavailable
        not_in_area: dashboard.section.not_in_area
    Direction:
      type: string
      enum: [better, worse, same, unknown]
      x-wording-keys: { better: common.move.better, worse: common.move.worse, same: dashboard.citations.no_change, unknown: common.move.unknown }
    Move:
      type: object
      description: "A change. Its words are the Direction's key (x-wording-keys), with [by]."
      required: [by, direction]
      additionalProperties: false
      properties:
        by: { type: [number, "null"], minimum: 0 }
        direction: { $ref: "#/components/schemas/Direction" }
    SectionBase:
      type: object
      required: [feature, status, view, shows, unlockedBy, weekly]
      properties:
        feature: { $ref: "#/components/schemas/FeatureId" }
        status: { $ref: "#/components/schemas/SectionStatus" }
        shows:
          description: "What this plan shows of the feature (header line `<plan label>: <shows>`); null when nothing. Keys dashboard.plan_shows.<feature>.<plan>."
          oneOf: [{ type: "null" }, { $ref: "#/components/schemas/Wording" }]
        unlockedBy: { $ref: "#/components/schemas/PlanLevel" }
        weekly: { type: boolean, description: "Monitoring: read every week, so the view carries its change." }
    BusinessHeader:
      type: object
      required: [name, domain, category]
      additionalProperties: false
      properties:
        name: { type: string }
        domain: { type: string }
        category: { type: [string, "null"], description: The category as Google spells it on the listing. }
    MemberBusiness:
      type: object
      required: [id, domain, name, plan]
      additionalProperties: false
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        domain: { type: string }
        name: { type: [string, "null"] }
        plan: { $ref: "#/components/schemas/PlanLevel" }
    CategoryWords:
      type: object
      description: How this kind of business names its customers, for the sentences that differ.
      required: [customers, customer, storefront, held, audience]
      additionalProperties: false
      properties:
        customers: { $ref: "#/components/schemas/WordingKey" }
        customer: { oneOf: [{ type: "null" }, { $ref: "#/components/schemas/WordingKey" }] }
        storefront: { type: boolean }
        held: { type: boolean }
        audience: { type: string }
    Common:
      type: object
      required: [plan, business, businesses, sample]
      properties:
        plan: { $ref: "#/components/schemas/PlanLevel" }
        business: { $ref: "#/components/schemas/BusinessHeader" }
        businesses: { type: array, description: "The organisation's businesses, for the switch (shown with 2 or more).", items: { $ref: "#/components/schemas/MemberBusiness" } }
        sample: { type: boolean, description: Engine answered from fixtures (invented data); staff see a marker. }
        words: { $ref: "#/components/schemas/CategoryWords" }
    EngineWeek:
      type: object
      required: [week, starts_at, complete_at, timezone]
      additionalProperties: false
      properties:
        week: { type: string, pattern: "^\\d{4}-W\\d{2}$" }
        starts_at: { type: string }
        complete_at: { type: string }
        timezone: { type: string }
    AlertNote:
      type: object
      required: [kind, sentence, date, part]
      additionalProperties: false
      properties:
        kind: { type: string, enum: [low_review, overtaken, ai_dropped, duplicate, listing_changed] }
        sentence: { $ref: "#/components/schemas/Wording" }
        date: { $ref: "#/components/schemas/EngineDate" }
        part: { type: string, enum: [reviews, grid, ai, listing] }
    GradeAt:
      type: object
      required: [date, letter, score]
      additionalProperties: false
      properties:
        date: { $ref: "#/components/schemas/EngineDate" }
        letter: { type: string }
        score: { type: number }
        basis: { type: string, enum: [full_scan, free_scan] }
        standard: { type: [string, "null"] }
        marker: { $ref: "#/components/schemas/Wording" }
    Comparison:
      type: object
      oneOf:
        - $ref: "#/components/schemas/ComparisonFigure"
        - $ref: "#/components/schemas/ComparisonPreparing"
        - $ref: "#/components/schemas/ComparisonNeutral"
      discriminator:
        propertyName: kind
        mapping:
          figure: "#/components/schemas/ComparisonFigure"
          preparing: "#/components/schemas/ComparisonPreparing"
          neutral: "#/components/schemas/ComparisonNeutral"
    ComparisonFigure:
      type: object
      required: [kind, line, note, widerThanCity]
      additionalProperties: false
      properties:
        kind: { type: string, const: figure }
        line: { $ref: "#/components/schemas/Wording" }
        note: { oneOf: [{ type: "null" }, { $ref: "#/components/schemas/Wording" }] }
        widerThanCity: { type: boolean }
    ComparisonPreparing:
      type: object
      required: [kind, line, figure]
      additionalProperties: false
      properties:
        kind: { type: string, const: preparing }
        line: { $ref: "#/components/schemas/Wording" }
        figure: { oneOf: [{ type: "null" }, { $ref: "#/components/schemas/Wording" }] }
    ComparisonNeutral:
      type: object
      required: [kind, line]
      additionalProperties: false
      properties:
        kind: { type: string, const: neutral }
        line: { $ref: "#/components/schemas/Wording" }
    AssistantQuestion:
      type: object
      required: [question, assistant]
      additionalProperties: false
      properties:
        question: { $ref: "#/components/schemas/ApprovedText" }
        assistant: { type: string }
    AiView:
      type: object
      required: [week, date, city, shareText, mentioned, pairs, notRead, change, newThisWeek, lostThisWeek, byAssistant, competitors, assistants, questions, trend]
      additionalProperties: false
      properties:
        week: { type: string }
        date: { $ref: "#/components/schemas/EngineDate" }
        city: { type: string }
        shareText: { type: string, description: 'A formatted percentage such as "43%" (a number, not a sentence).' }
        mentioned: { type: integer }
        pairs: { type: integer }
        notRead: { type: integer }
        change:
          oneOf:
            - type: "null"
            - type: object
              required: [previousWeek, share]
              additionalProperties: false
              properties:
                previousWeek: { type: string }
                share: { $ref: "#/components/schemas/Move" }
        newThisWeek: { type: array, items: { $ref: "#/components/schemas/AssistantQuestion" } }
        lostThisWeek: { type: array, items: { $ref: "#/components/schemas/AssistantQuestion" } }
        byAssistant:
          type: array
          items:
            type: object
            required: [label, mentioned, pairs, shareText, share]
            additionalProperties: false
            properties:
              label: { type: string, description: The assistant's name. }
              mentioned: { type: integer }
              pairs: { type: integer }
              shareText: { type: string, description: 'A formatted percentage such as "43%" (a number, not a sentence).' }
              share: { type: [number, "null"] }
        competitors:
          type: array
          maxItems: 5
          items:
            type: object
            required: [name, answers]
            additionalProperties: false
            properties:
              name: { type: string }
              answers: { type: integer }
        assistants: { type: array, items: { type: string } }
        questions:
          type: array
          items:
            type: object
            required: [question, cells]
            additionalProperties: false
            properties:
              question: { $ref: "#/components/schemas/ApprovedText" }
              cells:
                type: array
                items:
                  type: object
                  required: [assistant, mentioned, askedAt]
                  additionalProperties: false
                  properties:
                    assistant: { type: string }
                    mentioned: { type: [boolean, "null"] }
                    askedAt: { type: [string, "null"] }
        trend:
          type: array
          items:
            type: object
            required: [week, date, share, shareText, mentioned, pairs]
            additionalProperties: false
            properties:
              week: { type: string }
              date: { type: string }
              share: { type: [number, "null"] }
              shareText: { type: string, description: 'A formatted percentage such as "43%" (a number, not a sentence).' }
              mentioned: { type: integer }
              pairs: { type: integer }
    AiSection:
      allOf:
        - $ref: "#/components/schemas/SectionBase"
        - properties:
            view: { oneOf: [{ type: "null" }, { $ref: "#/components/schemas/AiView" }] }
    TopThreeRow:
      type: object
      required: [name, you, mapRank, mapLocations, reviews, rating, aiAnswers, aiBelowList]
      additionalProperties: false
      properties:
        name: { type: string }
        you: { type: boolean }
        mapRank: { type: [number, "null"] }
        mapLocations: { type: [integer, "null"] }
        reviews: { type: [integer, "null"] }
        rating: { type: [number, "null"] }
        aiAnswers: { type: [integer, "null"] }
        aiBelowList: { type: boolean }
    TopThree:
      type: object
      required: [rows, keyword, dates, aiAnswersOf, move]
      additionalProperties: false
      properties:
        rows: { type: array, items: { $ref: "#/components/schemas/TopThreeRow" } }
        keyword: { type: [string, "null"] }
        dates:
          type: object
          required: [grid, reviews, ai]
          additionalProperties: false
          properties:
            grid: { type: [string, "null"] }
            reviews: { type: [string, "null"] }
            ai: { type: [string, "null"] }
        aiAnswersOf: { type: [integer, "null"] }
        move:
          oneOf:
            - type: "null"
            - type: object
              required: [name, gained, now, since, date]
              additionalProperties: false
              properties:
                name: { type: string }
                gained: { type: number }
                now: { type: number }
                since: { type: string }
                date: { type: string }
    TaskState: { type: string, enum: [open, done, verified, reopened] }
    Tasks:
      type: object
      required: [reportDate, lastScan, total, left, items, tickable]
      additionalProperties: false
      properties:
        reportDate: { $ref: "#/components/schemas/EngineDate" }
        lastScan: { type: [string, "null"] }
        total: { type: integer }
        left: { type: integer }
        items:
          type: array
          items:
            type: object
            required: [rank, title, effort, state, stateDate, thisWeek]
            additionalProperties: false
            properties:
              rank: { type: integer }
              title: { $ref: "#/components/schemas/ApprovedText" }
              effort: { $ref: "#/components/schemas/ApprovedText" }
              state: { $ref: "#/components/schemas/TaskState" }
              stateDate: { type: [string, "null"] }
              thisWeek: { type: boolean }
        tickable: { type: boolean, description: "Monitoring: a tick is saved and the next scan checks it." }
    ReviewsBrief:
      type: object
      required: [date, google, yelp, change, notAvailable, sinceStart]
      additionalProperties: false
      properties:
        date: { $ref: "#/components/schemas/EngineDate" }
        google:
          type: object
          required: [read, rating, count, stars, perMonth, replied, repliedOf, replyShareText, last30Days, last30AtLeast, newest]
          additionalProperties: false
          properties:
            read: { type: boolean }
            rating: { type: [number, "null"] }
            count: { type: [integer, "null"] }
            stars:
              type: array
              items:
                type: object
                required: [stars, reviews]
                additionalProperties: false
                properties: { stars: { type: integer }, reviews: { type: integer } }
            perMonth:
              type: array
              items:
                type: object
                required: [month, reviews]
                additionalProperties: false
                properties: { month: { type: string }, reviews: { type: integer } }
            replied: { type: integer }
            repliedOf: { type: integer }
            replyShareText: { type: string, description: 'A formatted percentage such as "43%" (a number, not a sentence).' }
            last30Days: { type: [integer, "null"] }
            last30AtLeast: { type: boolean }
            newest:
              type: array
              maxItems: 10
              items:
                type: object
                required: [date, stars, replied]
                additionalProperties: false
                properties:
                  date: { type: [string, "null"] }
                  stars: { type: [integer, "null"] }
                  replied: { type: boolean }
        yelp:
          type: object
          required: [found, absent, read, rating, count, url]
          additionalProperties: false
          properties:
            found: { type: boolean }
            absent: { type: boolean }
            read: { type: boolean }
            rating: { type: [number, "null"] }
            count: { type: [integer, "null"] }
            url: { type: [string, "null"] }
        change:
          oneOf:
            - type: "null"
            - type: object
              required: [since, googleCount, yelpCount]
              additionalProperties: false
              properties:
                since: { type: string }
                googleCount: { $ref: "#/components/schemas/Move" }
                yelpCount: { $ref: "#/components/schemas/Move" }
        notAvailable: { type: array, items: { $ref: "#/components/schemas/Wording" } }
        sinceStart:
          oneOf:
            - type: "null"
            - type: object
              required: [start, from, then, now, collected, firstDay]
              additionalProperties: false
              properties:
                start: { type: string }
                from: { type: string }
                then: { type: integer }
                now: { type: integer }
                collected: { type: integer }
                firstDay: { type: boolean }
    ReviewsSection:
      allOf:
        - $ref: "#/components/schemas/SectionBase"
        - properties:
            view: { oneOf: [{ type: "null" }, { $ref: "#/components/schemas/ReviewsBrief" }] }
    ListingView:
      type: object
      required: [date, duplicates, photos, posts, since, firstWeek, profile]
      additionalProperties: false
      properties:
        date: { $ref: "#/components/schemas/EngineDate" }
        duplicates:
          type: object
          required: [read, candidates, searched]
          additionalProperties: false
          properties:
            read: { type: boolean }
            candidates:
              type: array
              items:
                type: object
                required: [name, address, phone, url, evidence, isNew]
                additionalProperties: false
                properties:
                  name: { type: [string, "null"] }
                  address: { type: [string, "null"] }
                  phone: { type: [string, "null"] }
                  url: { type: [string, "null"] }
                  evidence: { type: array, items: { $ref: "#/components/schemas/ApprovedText" } }
                  isNew: { type: boolean }
            searched: { type: array, items: { type: string } }
        photos:
          type: object
          required: [read, count, move]
          additionalProperties: false
          properties:
            read: { type: boolean }
            count: { type: [integer, "null"] }
