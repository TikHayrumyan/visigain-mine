                embedHtml: { $ref: "#/components/schemas/ApprovedText" }
                imagePath: { type: string }
                pagePath: { type: string }
                showBusiness: { type: boolean }
                showing: { type: boolean }
    VisibilityBadge:
      oneOf:
        - $ref: "#/components/schemas/SettingsHidden"
        - type: object
          required: [owner, businesses]
          additionalProperties: false
          properties:
            owner: { type: boolean }
            businesses: { type: array, items: { $ref: "#/components/schemas/VisibilityBadgeBusiness" } }
    BadgeBusinessRef:
      type: object
      required: [businessId]
      additionalProperties: false
      properties:
        businessId: { type: string, maxLength: 64, description: "A business id of the session organisation's own." }
    BadgeOptInRequest:
      type: object
      required: [businessId, consent, showBusiness]
      additionalProperties: false
      properties:
        businessId: { type: string, maxLength: 64 }
        consent: { type: boolean, description: "The box, never pre-ticked." }
        showBusiness: { type: boolean }
    BadgeShowBusinessRequest:
      type: object
      required: [businessId, showBusiness]
      additionalProperties: false
      properties:
        businessId: { type: string, maxLength: 64 }
        showBusiness: { type: boolean }
    Onboarding:
      type: object
      required: [hasOrganisation, kinds]
      additionalProperties: false
      properties:
        hasOrganisation: { type: boolean }
        kinds: { type: array, items: { type: string, enum: [business, agency] } }
    # ------------------------------------------------------------ chat ("Ask about your report")
    ChatHidden:
      type: object
      description: |
        The chat is not there for this business: hide the panel. `off`: a switch is off here (AI_CHAT_ENABLED, the
        admin's global or business switch, the staging allow rule); `not_monitoring`: the business has no live
        Monitoring; `paused`: its subscription is paused (the panel shows only `dashboard.chat.off`, no box).
      required: [availability, reason]
      additionalProperties: false
      properties:
        availability: { const: hidden }
        reason: { type: string, enum: [off, not_monitoring, paused] }
    ChatUsage:
      type: object
      description: |
        The month's allowance as the panel shows it (engine's figures, never a cost): `show` from 80% of the cap and at
        it, with `percent` (null below 80%) and `sentence` (`dashboard.chat.allowance`, or `dashboard.chat.limit` once
        `reached`: the box closes until `resetsOn`, a day in Los Angeles).
      required: [show, percent, resetsOn, reached, sentence]
      additionalProperties: false
      properties:
        show: { type: boolean }
        percent: { type: [integer, "null"], minimum: 80, maximum: 100 }
        resetsOn: { type: string, format: date }
        reached: { type: boolean }
        sentence:
          oneOf:
            - $ref: "#/components/schemas/Wording"
            - type: "null"
    ChatState:
      type: object
      required: [availability, business, off, usage, words]
      additionalProperties: false
      properties:
        availability: { const: available }
        business:
          type: object
          required: [domain]
          additionalProperties: false
          properties:
            domain: { $ref: "#/components/schemas/Domain" }
        off: { type: boolean, description: "The admin switched the chat off for this subscriber: show `dashboard.chat.off` and no box." }
        usage: { $ref: "#/components/schemas/ChatUsage" }
        words:
          type: object
          description: The panel's own sentences by their name in the panel (heading, intro, send, sending, ai_label, draft_label, thumbs_up, report, disclaimer and the rest), as keys.
          additionalProperties: { $ref: "#/components/schemas/WordingKey" }
    ChatMessage:
      type: object
      description: |
        A question (`role: user`: `text` as typed, masked) or an answer as stored. An answer that is one of our fixed
        replies comes as `wording` (a `dashboard.chat_reply.*` or `dashboard.chat.*` key) with `text` null; any other
        answer is `text`: the model's words, or a fixed answer from the client's own report, after every guard (show
        `dashboard.chat.ai_label` with it). `draft`: a draft to copy (`dashboard.chat.draft_label`). `choices`: buttons
        that ask them (a greeting's reply). Only an answer takes thumbs.
      required: [id, role, kind, text, wording, draft, choices, thumbs, at]
      additionalProperties: false
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        role: { type: string, enum: [user, assistant] }
        kind: { type: [string, "null"], enum: [answer, draft, refusal, redirect, fallback, limit, unavailable, null] }
        text: { type: [string, "null"], maxLength: 8000 }
        wording:
          oneOf:
            - $ref: "#/components/schemas/Wording"
            - type: "null"
        draft:
          oneOf:
            - type: object
              required: [kind, text]
              additionalProperties: false
              properties:
                kind: { type: string, enum: [google_post, review_reply, faq, service_text, other] }
                text: { type: string, maxLength: 8000 }
            - type: "null"
        choices:
          oneOf:
            - type: array
              items: { $ref: "#/components/schemas/Wording" }
            - type: "null"
        thumbs: { enum: [1, -1, null] }
        at: { type: string, format: date-time }
    ChatPage:
      type: object
      required: [items, nextCursor]
      additionalProperties: false
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/ChatMessage" } }
        nextCursor: { $ref: "#/components/schemas/NextCursor" }
    ChatAsk:
      description: Where a question stands, by its answer's id.
      oneOf:
        - type: object
          required: [id, status]
          additionalProperties: false
          properties:
            id: { $ref: "#/components/schemas/Uuid" }
            status: { const: pending }
        - type: object
          required: [id, status, question, answer, usage]
          additionalProperties: false
          properties:
            id: { $ref: "#/components/schemas/Uuid" }
            status: { const: done }
            question:
              description: The question as stored; null when its text was not stored (a patient's details), as the panel leaves it out.
              oneOf:
                - $ref: "#/components/schemas/ChatMessage"
                - type: "null"
            answer: { $ref: "#/components/schemas/ChatMessage" }
            usage: { $ref: "#/components/schemas/ChatUsage" }
        - type: object
          required: [id, status, reason, message]
          additionalProperties: false
          properties:
            id: { $ref: "#/components/schemas/Uuid" }
            status: { const: refused }
            reason:
              type: string
              enum: [off, busy, empty, paused, not_found, unknown]
              description: "`off`: switched off while it was out (`message` is `dashboard.chat.off`); `busy`: another question is out, or 30 this hour (the error line)."
            message: { $ref: "#/components/schemas/Wording" }
        - type: object
          required: [id, status, message]
          additionalProperties: false
          properties:
            id: { $ref: "#/components/schemas/Uuid" }
            status: { const: failed }
            message: { $ref: "#/components/schemas/Wording" }
    ChatQuestion:
      type: object
      required: [question]
      additionalProperties: false
      properties:
        question: { type: string, minLength: 1, maxLength: 4000, description: "Not blank. Sent to the model as typed; stored masked." }
    ChatThumbsRequest:
      type: object
      required: [value]
      additionalProperties: false
      properties:
        value: { enum: [1, -1, 0] }
    ChatThumbs:
      type: object
      required: [id, thumbs]
      additionalProperties: false
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        thumbs: { enum: [1, -1, null] }
    ChatProblemRequest:
      type: object
      required: [text]
      additionalProperties: false
      properties:
        text: { type: string, minLength: 1, maxLength: 4000 }

    # ------------------------------------------------------------ monitoring, group 1 part B
    ReviewsPageData:
      allOf:
        - $ref: "#/components/schemas/Common"
        - type: object
          required: [reviews, trend]
          properties:
            reviews: { $ref: "#/components/schemas/ReviewsSection" }
            trend:
              description: Monitoring's readings over time, oldest first; null unless `reviews.status` is ready.
              oneOf:
                - type: "null"
                - type: array
                  items:
                    type: object
                    required: [date, count, rating, replyShareText]
                    additionalProperties: false
                    properties:
                      date: { $ref: "#/components/schemas/EngineDate" }
                      count: { type: [integer, "null"] }
                      rating: { type: [number, "null"] }
                      replyShareText: { type: string, description: 'A formatted percentage such as "43%".' }
    ListingPageData:
      allOf:
        - $ref: "#/components/schemas/Common"
        - type: object
          required: [listing, alerts]
          properties:
            listing: { $ref: "#/components/schemas/ListingSection" }
            alerts: { type: array, maxItems: 5, items: { $ref: "#/components/schemas/AlertNote" } }
    FixModuleId: { type: string, enum: [grade, ai_answers, guardian, listings, reviews, pages, rivals, results] }
    FixStateId: { type: string, enum: [brief, drafting, draft, lint_failed, awaiting_owner, approved, rejected, published, remeasuring, done, expired] }
    FixerPageHead:
      type: object
      required: [business, businesses]
      properties:
        business:
          type: object
          required: [domain, name]
          additionalProperties: false
          properties:
            domain: { type: string }
            name: { type: [string, "null"] }
        businesses: { type: array, items: { $ref: "#/components/schemas/MemberBusiness" } }
    FixerHidden:
      type: object
      description: "The page is not offered for this business (the page answers 404): draw nothing of it and link nowhere to it. off: a switch is off here (always in production); not_monitoring: the business is not on Monitoring; not_offered: its category is not offered the tool."
      required: [state, modules, reason]
      additionalProperties: false
      properties:
        state: { const: hidden }
        modules: { type: array, items: { $ref: "#/components/schemas/FixModuleId" } }
        reason: { type: string, enum: [off, not_monitoring, not_offered] }
    FixerLocked:
      description: "A module not unlocked yet for this business (components/fixes/module-locked.tsx): its name as the title, what it does, and Coming soon. Never a date."
      allOf:
        - $ref: "#/components/schemas/FixerPageHead"
        - type: object
          required: [state, module, name, about, coming]
          properties:
            state: { const: locked }
            module: { $ref: "#/components/schemas/FixModuleId" }
            name: { $ref: "#/components/schemas/WordingKey" }
            about: { $ref: "#/components/schemas/WordingKey" }
            coming: { $ref: "#/components/schemas/WordingKey" }
    ReviewCardPage:
      type: object
      required: [business, businesses, offered, link, state, yelpUrl, unavailable, sample, textMessage, email, qr, sheets]
      additionalProperties: false
      properties:
        business:
          type: object
          required: [domain, name, plan]
          additionalProperties: false
          properties:
            domain: { type: string }
            name: { type: string, description: "The name the client gave, else the listing's, else the domain." }
            plan: { $ref: "#/components/schemas/PlanLevel" }
        businesses: { type: array, items: { $ref: "#/components/schemas/MemberBusiness" } }
        words: { $ref: "#/components/schemas/CategoryWords" }
        categoryWords: { $ref: "#/components/schemas/CategoryCustomerWords" }
        offered: { type: boolean, description: "false: a regulated category; the page shows `regulatedLine` and nothing else." }
        regulatedLine: { $ref: "#/components/schemas/WordingKey" }
        link: { type: [string, "null"], description: "Google's review link; null on the free plan, while being prepared, without a listing, or when engine did not answer." }
        state: { type: string, enum: [ready, preparing, no_listing] }
        yelpUrl: { type: [string, "null"], description: '"Your Yelp page": shown to the owner, never in a message.' }
        unavailable: { type: boolean, description: "Engine could not be read (say so, never \"no listing\")." }
        sample: { type: boolean, description: "Engine's fixtures, marked for staff only." }
        textMessage: { oneOf: [{ type: "null" }, { $ref: "#/components/schemas/WordingRef" }] }
        email:
          description: |
            The email a client copies, as keys (`dashboard.review_card.email.*`, [business] the business's name). Copied
            as "Subject: " and the subject, a blank line, then the lines joined by blank lines: `opening`, the `link` on
            a line of its own, `closing`. Null whenever `textMessage` is.
          oneOf:
            - type: "null"
            - type: object
              required: [subject, opening, closing]
              additionalProperties: false
              properties:
                subject: { $ref: "#/components/schemas/WordingRef" }
                opening: { type: array, items: { $ref: "#/components/schemas/Wording" } }
                closing: { type: array, items: { $ref: "#/components/schemas/Wording" } }
        qr:
          description: The backend's QR code routes (outside /api/v1); null without a link.
          oneOf:
            - type: "null"
            - type: object
              required: [png, svg]
              additionalProperties: false
              properties:
                png: { type: string }
                svg: { type: string }
        sheets:
          type: array
          description: The printable sheets (Monitoring only), each a backend PDF route.
          items:
            type: object
            required: [kind, size, title, note, href]
            additionalProperties: false
            properties:
              kind: { type: string, enum: [counter-card, table-tent] }
              size: { type: string }
              title: { $ref: "#/components/schemas/WordingKey" }
              note: { $ref: "#/components/schemas/WordingKey" }
              href: { type: string }
    ReviewRequestCounts:
      type: object
      required: [today, month, perDay, perMonth, leftToday, leftMonth]
      additionalProperties: false
      properties:
        today: { type: integer }
        month: { type: integer }
        perDay: { type: integer }
        perMonth: { type: integer }
        leftToday: { type: integer }
        leftMonth: { type: integer }
    ReviewVelocityRow:
      type: object
      required: [name, daysSinceLast, reviews30d]
      additionalProperties: false
      properties:
        name: { type: [string, "null"], description: "null for the business itself." }
        daysSinceLast: { type: [number, "null"] }
        reviews30d: { type: [number, "null"] }
    AskForReviewsOpen:
      allOf:
        - $ref: "#/components/schemas/FixerPageHead"
        - type: object
          required: [state, counts, limits, link, defaultMessage, preview, noLink, card, velocity]
          properties:
            state: { const: open }
            counts: { $ref: "#/components/schemas/ReviewRequestCounts" }
            limits:
              type: object
              required: [messageMax, listMax]
              additionalProperties: false
              properties:
                messageMax: { type: integer }
                listMax: { type: integer }
            link: { type: [string, "null"], description: "The business's one Google review link; null while it is not ready (no form then)." }
            defaultMessage: { $ref: "#/components/schemas/Wording" }
            preview:
              description: '"What your customers receive": the request email, as keys (the paragraph is the owner''s).'
              oneOf:
                - type: "null"
                - type: object
                  required: [subject, heading, greeting, button, link, after, reason, unsubscribe, unsubscribeNote]
                  additionalProperties: false
                  properties:
                    subject: { $ref: "#/components/schemas/Wording" }
                    heading: { $ref: "#/components/schemas/Wording" }
                    greeting: { $ref: "#/components/schemas/Wording" }
                    button: { $ref: "#/components/schemas/Wording" }
                    link: { type: string }
                    after: { $ref: "#/components/schemas/Wording" }
                    reason: { $ref: "#/components/schemas/Wording" }
                    unsubscribe: { $ref: "#/components/schemas/Wording" }
                    unsubscribeNote: { $ref: "#/components/schemas/Wording" }
            noLink: { oneOf: [{ type: "null" }, { $ref: "#/components/schemas/Wording" }] }
            card:
              description: '"Ask in person": the review card (this API) and its QR code (a backend route).'
              oneOf:
                - type: "null"
                - type: object
                  required: [page, qrPng]
                  additionalProperties: false
                  properties:
                    page: { type: string }
                    qrPng: { type: string }
            velocity:
              oneOf:
                - type: object
                  required: [ok]
                  additionalProperties: false
                  properties:
                    ok: { const: false }
                - type: object
                  required: [ok, you, competitors, asOf]
                  additionalProperties: false
                  properties:
                    ok: { const: true }
                    you: { $ref: "#/components/schemas/ReviewVelocityRow" }
                    competitors: { type: array, maxItems: 3, items: { $ref: "#/components/schemas/ReviewVelocityRow" } }
                    asOf: { type: [string, "null"] }
    AskForReviewsPage:
      oneOf:
        - $ref: "#/components/schemas/AskForReviewsOpen"
        - $ref: "#/components/schemas/FixerHidden"
    SendReviewRequestsRequest:
      type: object
      required: [list, permission]
      additionalProperties: false
      properties:
        list: { type: string, description: "One customer per line (an email address, or a name and an address), or a CSV file's text." }
        message: { type: string, maxLength: 2000, description: "The owner's paragraph; empty or left out is the default (`defaultMessage`)." }
        permission: { type: boolean, description: '"I have permission to email these customers."' }
    ReviewRequestsSent:
      type: object
      required: [sent, tone, lines, counts]
      additionalProperties: false
      properties:
        sent: { type: boolean, description: "false: the form's refusal (`lines` say why); nothing was queued." }
        tone: { type: string, enum: [success, error] }
        lines: { type: array, items: { $ref: "#/components/schemas/Wording" } }
        queued: { type: integer }
        duplicates: { type: integer }
        suppressed: { type: integer }
        overCap: { type: integer }
        counts: { $ref: "#/components/schemas/ReviewRequestCounts" }
    ReviewToAnswer:
      type: object
      required: [fixId, rating, text, language, reviewedAt, url, state, reply, hints, regulatedHint]
      additionalProperties: false
      properties:
        fixId: { $ref: "#/components/schemas/Uuid" }
        rating: { type: integer }
        text: { type: [string, "null"], description: "The review as Google shows it, masked." }
        language: { type: string }
        reviewedAt: { type: string, format: date-time }
        url: { type: [string, "null"] }
        state: { $ref: "#/components/schemas/FixStateId" }
        reply: { type: [string, "null"], description: "The draft reply, or the owner's last edit." }
        hints: { type: array, items: { $ref: "#/components/schemas/WordingKey" } }
        regulatedHint: { oneOf: [{ type: "null" }, { $ref: "#/components/schemas/WordingKey" }] }
    ReviewsToAnswerPage:
      oneOf:
        - allOf:
            - $ref: "#/components/schemas/FixerPageHead"
            - type: object
              required: [state, batch, items]
              properties:
                state: { const: open }
                batch: { type: boolean, description: "Drafts are written in a batch here: a draft being written says it is usually ready within a few hours." }
                items: { type: array, items: { $ref: "#/components/schemas/ReviewToAnswer" } }
        - $ref: "#/components/schemas/FixerHidden"
    ServicePageItem:
      type: object
      required: [fixId, kind, subject, briefRef, state, text, hints, regulatedHint, publishedAt]
      additionalProperties: false
      properties:
        fixId: { oneOf: [{ type: "null" }, { $ref: "#/components/schemas/Uuid" }] }
        kind: { type: string, enum: [service_page, blog_topic] }
        subject: { type: string }
        briefRef: { type: string }
        state: { oneOf: [{ type: "null" }, { $ref: "#/components/schemas/FixStateId" }] }
        text: { type: [string, "null"] }
        hints: { type: array, items: { $ref: "#/components/schemas/WordingKey" } }
        regulatedHint: { oneOf: [{ type: "null" }, { $ref: "#/components/schemas/WordingKey" }] }
        publishedAt: { type: [string, "null"], format: date-time }
    ServicePagesOpen:
      allOf:
        - $ref: "#/components/schemas/FixerPageHead"
        - type: object
          required: [state, offers, services, blogs, blogOpen, blogAfterApprovedPages, items, batch, used, caps, resetsOn]
          properties:
            state: { const: open }
            offers: { type: string, enum: [ok, hidden], description: "hidden: engine did not answer, or the category gets no page builder." }
            services:
              type: array
              description: The real services with no page yet, each with "Write a draft".
              items:
                type: object
                required: [briefId, service, keyword, rank, competitorRank, questions]
                additionalProperties: false
                properties:
                  briefId: { type: string }
                  service: { type: string }
                  keyword: { type: string }
                  rank: { type: [integer, "null"] }
                  competitorRank: { type: [integer, "null"] }
                  questions: { type: array, items: { type: string } }
            blogs:
              type: array
              items:
                type: object
                required: [briefId, question, service]
                additionalProperties: false
                properties:
                  briefId: { type: string }
                  question: { type: string }
                  service: { type: string }
            blogOpen: { type: boolean }
            blogAfterApprovedPages: { type: integer }
            items: { type: array, items: { $ref: "#/components/schemas/ServicePageItem" } }
            batch: { type: boolean }
            used:
              type: object
              required: [service_page, blog_topic]
              additionalProperties: false
              properties: { service_page: { type: integer }, blog_topic: { type: integer } }
            caps:
              type: object
              required: [service_page, blog_topic]
              additionalProperties: false
              properties: { service_page: { type: integer }, blog_topic: { type: integer } }
            resetsOn: { type: string, format: date, description: "The first day of the next Los Angeles month." }
    ServicePagesPage:
      oneOf:
        - $ref: "#/components/schemas/ServicePagesOpen"
        - $ref: "#/components/schemas/FixerLocked"
        - $ref: "#/components/schemas/FixerHidden"

    # ------------------------------------------------------------ fixers (FixModule: Monitoring part A's too)
    FixModule: { type: string, enum: [grade, ai_answers, guardian, listings, reviews, pages, rivals, results], description: "The eight named modules (src/server/fixes/switches.ts FIX_MODULES)." }
    FixState: { type: string, enum: [brief, drafting, draft, lint_failed, awaiting_owner, approved, rejected, published, remeasuring, done, expired] }
    FixersHidden:
      type: object
      required: [hidden, reason]
      additionalProperties: false
      description: The page is hidden here (the app draws nothing of it).
      properties:
        hidden: { const: true }
        reason: { type: string, enum: ["off", not_monitoring, no_fixer], description: "off: FIXERS_ENABLED or the module's switch; not_monitoring; no_fixer: a category that gets no fixer." }
    FixSteps:
      type: object
      required: [edit, approve, reject, remeasure]
      additionalProperties: false
      description: The steps the caller may take now (the fix's state, its kind and the caller's role).
      properties:
        edit: { type: boolean }
        approve: { type: boolean }
        reject: { type: boolean }
        remeasure: { type: boolean, description: "The posted or published step, which starts the re-measure." }
    FixSummary:
      type: object
      required: [id, module, kind, state, createdAt, updatedAt, expiresAt, steps]
      additionalProperties: false
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        module: { $ref: "#/components/schemas/FixModule" }
        kind: { type: string, pattern: "^[a-z_]+$", description: "review_reply, service_page, blog_topic, or another fixer's kind." }
        state: { $ref: "#/components/schemas/FixState" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        expiresAt: { type: [string, "null"], format: date-time, description: "When a fix waiting for its owner expires." }
        steps: { $ref: "#/components/schemas/FixSteps" }
    FixPaused:
      type: [object, "null"]
      required: [until]
      additionalProperties: false
      description: The business's Monitoring pause, null when there is none.
      properties:
        until: { type: string, format: date-time }
    FixModuleState:
      type: object
      required: [module, on, unlocked, unlockDay, early]
      additionalProperties: false
      properties:
        module: { $ref: "#/components/schemas/FixModule" }
        on: { type: boolean, description: "FIXERS_ENABLED and fixers.module.<module>." }
        unlocked: { type: boolean }
        unlockDay: { type: integer, minimum: 0, description: "The day of Monitoring it unlocks on." }
        early: { type: boolean, description: "Unlocked early by an admin." }
    FixBusiness:
      type: object
      required: [domain]
      additionalProperties: false
      properties:
        domain: { $ref: "#/components/schemas/Domain" }
    FixList:
      type: object
      required: [hidden, business, role, day, paused, modules, items]
      additionalProperties: false
      properties:
        hidden: { const: false }
        business: { $ref: "#/components/schemas/FixBusiness" }
        role: { type: string, enum: [owner, member] }
        day: { type: integer, minimum: 0, description: "The business's day of Monitoring (0 on the first)." }
        paused: { $ref: "#/components/schemas/FixPaused" }
        modules: { type: array, items: { $ref: "#/components/schemas/FixModuleState" } }
        items: { type: array, items: { $ref: "#/components/schemas/FixSummary" } }
    FixLint:
      type: [object, "null"]
      required: [passed, hints]
      additionalProperties: false
      properties:
        passed: { type: boolean }
        hints: { type: array, items: { $ref: "#/components/schemas/WordingKey" }, description: "The module's approved hints for what the lint found." }
    FixDetail:
      type: object
      required: [hidden, business, fix, draft, log]
      additionalProperties: false
      properties:
        hidden: { const: false }
        business: { $ref: "#/components/schemas/FixBusiness" }
