      additionalProperties: false
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/GradeHistoryItem" } }
        nextCursor: { $ref: "#/components/schemas/NextCursor" }
    DashboardOverview:
      allOf:
        - $ref: "#/components/schemas/Common"
        - type: object
          required: [organisation, hasData, week, checkedAt, alerts, ai, topThree, grades, tasks, reviews, listing, grid, ranks, citations, count, reviewLink, monitoring, quickWins, businessGrades, creditCents, pastDue]
          properties:
            organisation:
              type: object
              required: [id, name]
              additionalProperties: false
              properties:
                id: { $ref: "#/components/schemas/Uuid" }
                name: { type: string }
            hasData: { type: boolean }
            week: { oneOf: [{ type: "null" }, { $ref: "#/components/schemas/EngineWeek" }] }
            checkedAt: { type: [string, "null"], description: The newest date any part was read. }
            alerts: { type: array, maxItems: 5, items: { $ref: "#/components/schemas/AlertNote" } }
            ai: { $ref: "#/components/schemas/AiSection" }
            topThree: { oneOf: [{ type: "null" }, { $ref: "#/components/schemas/TopThree" }], description: Null on Free. }
            grades: { type: array, description: "The grade over time, oldest first (show the first and the last 5).", items: { $ref: "#/components/schemas/GradeAt" } }
            standardNote: { type: array, items: { $ref: "#/components/schemas/Wording" } }
            comparison: { $ref: "#/components/schemas/Comparison" }
            tasks: { oneOf: [{ type: "null" }, { $ref: "#/components/schemas/Tasks" }], description: Null on Free and without a Full Report. }
            reviews: { $ref: "#/components/schemas/ReviewsSection" }
            listing: { $ref: "#/components/schemas/ListingSection" }
            grid: { $ref: "#/components/schemas/GridSection" }
            ranks: { $ref: "#/components/schemas/RanksSection" }
            citations: { $ref: "#/components/schemas/CitationsBriefSection" }
            count: { oneOf: [{ type: "null" }, { $ref: "#/components/schemas/CitationCount" }], description: "Free: the directory count alone." }
            reviewLink: { $ref: "#/components/schemas/ReviewLinkSection" }
