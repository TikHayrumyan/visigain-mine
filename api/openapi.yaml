  # ---------------------------------------------------------------- the features built on staging (group 6)
  # Each behind its own switch and refused in production, as its pages are: off, the page's 404 (here the one error
  # shape's not_found), so the app hides the page. GET /site says which are on.

  /api/v1/free-ai-check/form:
    get:
      tags: [public]
      operationId: getFreeAiCheckForm
      summary: The free AI check's form (a fresh stamp, the categories, the limits, the bot check)
      x-visigain-availability: behind-switch
      x-visigain-switch: FREE_AI_CHECK_ENABLED
      responses:
        "200":
          description: Draw the form. Send `stamp` back with it; draw the Turnstile widget only when `bot.siteKey` is set.
          headers:
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FreeAiCheckForm" }
              examples:
                form: { $ref: "examples/free-ai-check-form.json" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/v1/free-ai-check:
    post:
      tags: [public]
      operationId: startFreeAiCheck
      summary: Run the free AI check ("Do ChatGPT, Gemini and Perplexity recommend you?")
      description: |
        The form's action, unchanged: the honeypot (`message`) and the stamp, the bot check, the fields, the limits (per
        address, email, business, and the day's total) and the reuse of a check already made (`reused`). Every refusal is
        the page's own alert: 422 `invalid_name`, `city_not_covered`, `invalid_category`, `invalid_domain`,
        `name_not_distinctive`, `bot_refused`, `form_expired`; 503 `check_unavailable` for every limit reached and every
        time the answers cannot be had (the page says one sentence for all of them).
      x-visigain-availability: behind-switch
      x-visigain-switch: FREE_AI_CHECK_ENABLED
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FreeAiCheckRequest" }
            examples:
              check: { $ref: "examples/free-ai-check-request.json" }
      responses:
        "201":
          description: Started (or the same check again). Open the result with `viewToken`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FreeAiCheckStarted" }
              examples:
                started: { $ref: "examples/free-ai-check-started.json" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /api/v1/free-ai-check/results/{token}:
    get:
      tags: [public]
      operationId: getFreeAiCheck
      summary: A free AI check's result, for whoever holds its key
      description: |
        `pending`: still collecting; look again after `refreshSeconds` (engine is read at most once in 10 seconds for a
        check, however many look). `try_later`: no answer could be had. `ready`: the count with its date, who was named
        instead (a plain list: its order is no rank), the detail only once the address is confirmed, and the share link
        while it works. What a visitor or engine wrote (a name, a question, an assistant's label) is plain text.
      x-visigain-availability: behind-switch
      x-visigain-switch: FREE_AI_CHECK_ENABLED
      parameters:
        - $ref: "#/components/parameters/FreeAiCheckToken"
      responses:
        "200":
          description: The result page's state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FreeAiCheckView" }
              examples:
                ready: { $ref: "examples/free-ai-check-ready.json" }
                pending: { $ref: "examples/free-ai-check-pending.json" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/v1/free-ai-check/results/{token}/detail:
    post:
      tags: [public]
      operationId: requestFreeAiCheckDetail
      summary: Ask for the full detail (an email with a link to confirm the address)
      description: |
        The gate's form: the box (required, never pre-ticked) and the address; the consent is recorded with its words,
        and the confirm email is held by the send until its own words are approved. 409 `check_not_ready` while the
        check has no result; 503 `check_unavailable` past the limits.
      x-visigain-availability: behind-switch
      x-visigain-switch: FREE_AI_CHECK_ENABLED
      parameters:
        - $ref: "#/components/parameters/FreeAiCheckToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FreeAiCheckDetailRequest" }
            examples:
              detail: { $ref: "examples/free-ai-check-detail-request.json" }
      responses:
        "202": { description: "Taken: show the gate's sent line (x-wording-keys gate_sent of FreeAiCheckView)." }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /api/v1/free-ai-check/results/{token}/next:
    post:
      tags: [public]
      operationId: nextFreeAiCheckStep
      summary: The free grade or the Full Report, after a confirmed address
      description: The step is counted; go to `path` (the free scan's form with the website only, never an email; or /pricing). 404 before the address is confirmed.
      x-visigain-availability: behind-switch
      x-visigain-switch: FREE_AI_CHECK_ENABLED
      parameters:
        - $ref: "#/components/parameters/FreeAiCheckToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FreeAiCheckNextRequest" }
            examples:
              grade: { $ref: "examples/free-ai-check-next-request.json" }
      responses:
        "200":
          description: Where the button goes.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FreeAiCheckNext" }
              examples:
                grade: { $ref: "examples/free-ai-check-next.json" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/v1/free-ai-check/results/{token}/share:
    post:
      tags: [public]
      operationId: shareFreeAiCheck
      summary: Make a link anyone can open (one per check; a new one replaces the old)
      description: It shows the count, the date, the city and the type of business, and the name only if `showName`. Never who was named instead, never the email.
      x-visigain-availability: behind-switch
      x-visigain-switch: FREE_AI_CHECK_ENABLED
      parameters:
        - $ref: "#/components/parameters/FreeAiCheckToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FreeAiCheckShareRequest" }
            examples:
              share: { $ref: "examples/free-ai-check-share-request.json" }
      responses:
        "201":
          description: The link, and until when it works (30 days).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FreeAiCheckShare" }
              examples:
                share: { $ref: "examples/free-ai-check-share.json" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/RateLimited" }
    delete:
      tags: [public]
      operationId: unshareFreeAiCheck
      summary: Remove the share link (it stops at once)
      x-visigain-availability: behind-switch
      x-visigain-switch: FREE_AI_CHECK_ENABLED
      parameters:
        - $ref: "#/components/parameters/FreeAiCheckToken"
      responses:
        "204": { description: "Removed: show share_removed (x-wording-keys of FreeAiCheckView)." }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/v1/free-ai-check/confirm/{code}:
    get:
      tags: [public]
      operationId: getFreeAiCheckConfirm
      summary: The emailed link's page (opening it changes nothing)
      x-visigain-availability: behind-switch
      x-visigain-switch: FREE_AI_CHECK_ENABLED
      parameters:
        - $ref: "#/components/parameters/FreeAiCheckCode"
      responses:
        "200":
          description: The code is good. Draw the page with its button (confirm_button).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FreeAiCheckConfirm" }
              examples:
                confirm: { $ref: "examples/free-ai-check-confirm.json" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
    post:
      tags: [public]
      operationId: confirmFreeAiCheck
      summary: The confirm page's button (the address is confirmed once)
      x-visigain-availability: behind-switch
      x-visigain-switch: FREE_AI_CHECK_ENABLED
      parameters:
        - $ref: "#/components/parameters/FreeAiCheckCode"
      responses:
        "200":
          description: Confirmed. Open the result with `viewToken`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FreeAiCheckStartedToken" }
              examples:
                confirmed: { $ref: "examples/free-ai-check-confirmed.json" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/v1/free-ai-check/shared/{token}:
    get:
      tags: [public]
      operationId: getSharedFreeAiCheck
      summary: A shared free AI check (never a rival's name; opening it writes nothing)
      x-visigain-availability: behind-switch
      x-visigain-switch: FREE_AI_CHECK_ENABLED
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string, pattern: "^[A-Za-z0-9_-]{43}$" }
      responses:
        "200":
          description: What its maker chose to show.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SharedFreeAiCheck" }
              examples:
                shared: { $ref: "examples/free-ai-check-shared.json" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/v1/partner:
    get:
      tags: [partner]
      operationId: getPartner
      summary: The signed-in person's partner page, or the application when they have none
      description: |
        `none`: draw the application (/partner/apply). `applied`, `rejected`, `paused`: the page's one line. `approved`:
        the link and code, the referred businesses by name with a status (never a report, never their website), the three
